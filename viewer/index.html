<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firesight 3D</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --muted:#8b949e;
          --fire:#ff4d3d; --smoke:#d9a441; --safe:#3fb950; --route:#58a6ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow:hidden; }
  #app { position:fixed; inset:0; }
  #panel { position:fixed; top:12px; left:12px; width:300px; max-height:calc(100% - 24px); overflow:auto;
           background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; z-index:2; }
  h1 { font-size:15px; margin:0 0 2px; } .sub { color:var(--muted); margin-bottom:10px; }
  .row { display:flex; gap:6px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  label { color:var(--muted); font-size:12px; }
  select, button, input[type=range] { font:inherit; }
  select, button { background:#21262d; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  button { cursor:pointer; } button:hover { border-color:#8b949e; }
  button.primary { background:#da3633; border-color:#da3633; }
  button.on { background:#1f6feb; border-color:#1f6feb; }
  #btnIgnite.on { background:var(--fire); border-color:var(--fire); color:#fff; }
  select { flex:1; min-width:0; }
  .sec { border-top:1px solid var(--line); margin-top:10px; padding-top:8px; }
  .k { color:var(--muted); } .bad { color:var(--fire); } .good { color:var(--safe); }
  ol { margin:6px 0 0 18px; padding:0; } li { margin:2px 0; }
  #warn { color:var(--smoke); font-size:12px; white-space:pre-wrap; }
  #legend span { display:inline-flex; align-items:center; gap:4px; margin-right:8px; font-size:12px; color:var(--muted); }
  #legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }
  .lbl { color:#c9d1d9; font-size:10px; background:rgba(14,17,22,.65); padding:1px 4px; border-radius:3px;
         pointer-events:auto; white-space:nowrap; }
  #origins { max-height:88px; overflow:auto; font-size:12px; }
  #origins div { margin:1px 0; }
  #hint { position:fixed; bottom:12px; right:12px; color:var(--muted); font-size:12px; background:var(--panel);
          border:1px solid var(--line); border-radius:8px; padding:6px 10px; z-index:2; }
  #toast { position:fixed; left:50%; bottom:48px; transform:translateX(-50%); display:none; z-index:6;
           background:#21262d; border:1px solid var(--line); border-radius:8px; padding:8px 14px; }
  #tip { position:fixed; z-index:7; display:none; pointer-events:none; background:#21262d; color:var(--text);
         border:1px solid var(--line); border-radius:4px; padding:3px 6px; font-size:12px; max-width:240px; }
  @media (max-width: 640px) { #panel { width:calc(100% - 24px); max-height:45%; } #hint { display:none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="panel">
  <h1>Firesight</h1>
  <div class="sub" id="bname">Loading building…</div>

  <div class="row"><label>Fire in</label><select id="roomSel"></select></div>
  <div class="row">
    <button class="primary" id="btnFire">Add fire</button>
    <button id="btnStep">Step</button>
    <button id="btnPlay">Play</button>
    <button id="btnReset">Reset</button>
  </div>
  <div class="row">
    <button id="btnIgnite">Click to start fire</button>
  </div>
  <div class="row">
    <label>Mode</label>
    <button id="modeSim" class="on">Simulate</button>
    <button id="modeRep">Reports only</button>
  </div>
  <div class="row"><label for="speed">Speed</label>
    <select id="speed">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="4">4</option>
    </select>
  </div>
  <div class="row k" id="tval">t = 0</div>
  <div id="origins" class="k"></div>

  <div class="sec">
    <div class="row"><label>Show floor</label><select id="floorSel"><option value="all">All floors</option></select></div>
    <div class="row"><label>Floor spacing</label><input id="gap" type="range" min="3" max="20" step="0.5" value="9"></div>
    <div class="row">
      <button id="btnLabels" class="on">Labels</button>
      <button id="btnAll">All routes</button>
    </div>
    <div id="legend" class="row">
      <span><i style="background:var(--fire)"></i>Fire</span>
      <span><i style="background:var(--smoke)"></i>Smoke</span>
      <span><i style="background:var(--safe)"></i>Exit / clear stairs</span>
      <span><i style="background:var(--route)"></i>Route</span>
    </div>
  </div>

  <div class="sec">
    <div class="k">Click a walkable spot for the escape route. It reroutes live as the fire spreads. Click to start fire places a fire where you click.</div>
    <div id="routeInfo" style="margin-top:6px"></div>
  </div>
  <div class="sec" id="warnSec" style="display:none"><div class="k">Map warnings</div><div id="warn"></div></div>
</div>
<div id="hint">Drag to rotate · Scroll to zoom · Right-drag to pan</div>
<div id="toast"></div>
<div id="tip"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const API = "";
const WALL_H = 1.2;
const STEP_N = 12;
const STEP_W = 1.2;
const TICK_MS = 600;
const SNAP_M = 1.5;
const COLORS = {
  floor: 0x3d4654, room: 0x56627a, hallway: 0x66738a, stairwell: 0x3f7a52, elevator: 0x6a6a7a,
  wall: 0xd0d7de, fire: 0xff4d3d, smoke: 0xd9a441, safe: 0x3fb950, route: 0x58a6ff, exit: 0x3fb950,
};
const SKIP_ID = /-U\d+$|VOID/;

const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x2a313c);
app.appendChild(renderer.domElement);

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = "fixed";
labelRenderer.domElement.style.inset = "0";
labelRenderer.domElement.style.pointerEvents = "none";
app.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 2000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(30, 60, 20);
scene.add(sun);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

let building = null, grid = null, levels = [];
let gridLinks = [];
let gap = 9;
const floorGroups = new Map();
const roomMeshes = new Map();
const hazardMeshes = new Map();
const plates = [];
const walkMask = new Map();
const solidMask = new Map();
let displayGrid = null;
const displayMask = new Map();
const stairMats = [];
let stairLandings = [];
let cellGeom = null;
const wallUnit = new THREE.BoxGeometry(1, WALL_H, 1);
wallUnit.userData.shared = true;

let verticalGroup = new THREE.Group(); scene.add(verticalGroup);
let ghostGroup = new THREE.Group(); scene.add(ghostGroup);
let routeGroup = new THREE.Group(); scene.add(routeGroup);
let allRoutesGroup = new THREE.Group(); scene.add(allRoutesGroup);
const stepUnit = new THREE.BoxGeometry(1, 1, 1);
stepUnit.userData.shared = true;
const hallMat = new THREE.MeshStandardMaterial({
  color: COLORS.room, transparent: true, opacity: 0.55, roughness: 0.8,
  depthWrite: true, side: THREE.DoubleSide,
});
hallMat.userData.shared = true;
let stepRecs = [];
const HALL_TIERS = 6;
const HALL_RING = 36;

let lastStart = null, cachedRoute = null, cachedAll = null;
let playing = false, playToken = 0, playTick = 0, showAll = false, ignite = false, fireMode = "simulate";
let lastState = null, labelsFar = false, labelDomDirty = true;
let chain = Promise.resolve();
let toastTimer = null;

const $ = (id) => document.getElementById(id);
const levelY = (lv) => {
  let i = levels.indexOf(lv);
  if (i < 0) i = levels.indexOf(Number(lv));
  return (i < 0 ? 0 : i) * gap;
};
const api = async (path, opts) => {
  const r = await fetch(API + path, opts);
  if (!r.ok) {
    const text = await r.text();
    let msg = text || r.statusText;
    try {
      const j = JSON.parse(text);
      if (j && j.detail) msg = typeof j.detail === "string" ? j.detail : JSON.stringify(j.detail);
    } catch (e) { /* keep raw text */ }
    throw new Error(msg);
  }
  return r.json();
};
const post = (path, body) => api(path, {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify(body || {}),
});
function enqueue(fn) {
  const run = chain.then(fn, fn);
  chain = run.then(() => {}, () => {});
  return run;
}
function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function showToast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = "none"; }, 1800);
}
function speedN() {
  const n = parseInt($("speed").value, 10);
  return n === 2 || n === 4 ? n : 1;
}

function shapeFrom(poly) {
  return new THREE.Shape(poly.map(([x, y]) => new THREE.Vector2(x, -y)));
}
function flatGeom(poly) {
  const g = new THREE.ShapeGeometry(shapeFrom(poly));
  g.rotateX(-Math.PI / 2);
  return g;
}
function clearGroup(g) {
  const geos = new Set(), mats = new Set();
  g.traverse((o) => {
    if (o.geometry && !o.geometry.userData?.shared) geos.add(o.geometry);
    const mat = o.material;
    if (mat) {
      const list = Array.isArray(mat) ? mat : [mat];
      for (const m of list) if (m && !m.userData?.shared) mats.add(m);
    }
    if (o.element && o.element.parentNode) o.element.remove();
  });
  for (const geo of geos) geo.dispose();
  for (const m of mats) m.dispose();
  g.clear();
}
function centroid(poly) {
  let x = 0, y = 0;
  for (const p of poly) { x += p[0]; y += p[1]; }
  return [x / poly.length, y / poly.length];
}
function namedSpace(s) {
  if (!s || s.type === "unknown" || s.type === "void") return false;
  const label = (s.label || "").trim();
  if (!label || label.toLowerCase() === "unlabeled") return false;
  if (SKIP_ID.test(s.id || "")) return false;
  return true;
}
function roomNumber(label) {
  return String(label || "").trim().split(/\s+/)[0] || "";
}
function moveTip(e) {
  const tip = $("tip");
  tip.style.left = (e.clientX + 12) + "px";
  tip.style.top = (e.clientY + 14) + "px";
}
function makeLabel(text, full, x, y, z, color) {
  const div = document.createElement("div");
  div.className = "lbl";
  div.textContent = text;
  if (color) div.style.color = color;
  if (full) {
    div.addEventListener("pointerenter", (e) => {
      const tip = $("tip");
      tip.textContent = full;
      tip.style.display = "block";
      moveTip(e);
    });
    div.addEventListener("pointermove", moveTip);
    div.addEventListener("pointerleave", () => { $("tip").style.display = "none"; });
  }
  const lbl = new CSS2DObject(div);
  lbl.position.set(x, y, z);
  lbl.userData.isLabel = true;
  return lbl;
}

function decodeBits(b64, n) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const bits = new Uint8Array(n);
  for (let i = 0; i < n; i++) bits[i] = (bytes[i >> 3] >> (7 - (i & 7))) & 1;
  return bits;
}
function countOn(bits) {
  if (!bits) return 1;
  let n = 0;
  for (let i = 0; i < bits.length; i++) n += bits[i];
  return Math.max(1, n);
}
function bitOn(mask, r, c) {
  if (!mask || r < 0 || c < 0 || r >= grid.rows || c >= grid.cols) return false;
  return mask[r * grid.cols + c] === 1;
}
function cellX(c) { return grid.origin_x + (c + 0.5) * grid.cell; }
function cellZ(r) { return grid.origin_y + (r + 0.5) * grid.cell; }
function snapWalkable(level, x, z) {
  const mask = walkMask.get(level);
  const cell = grid.cell;
  const c0 = Math.floor((x - grid.origin_x) / cell);
  const r0 = Math.floor((z - grid.origin_y) / cell);
  const center = (r, c) => ({ r, c, x: cellX(c), y: cellZ(r) });
  if (bitOn(mask, r0, c0)) return center(r0, c0);
  const rad = Math.ceil(SNAP_M / cell) + 1;
  let best = null, bestD = SNAP_M;
  for (let dr = -rad; dr <= rad; dr++) {
    for (let dc = -rad; dc <= rad; dc++) {
      const r = r0 + dr, c = c0 + dc;
      if (!bitOn(mask, r, c)) continue;
      const p = center(r, c);
      const d = Math.hypot(p.x - x, p.y - z);
      if (d <= bestD) { bestD = d; best = p; }
    }
  }
  return best;
}

function addOutline(group, poly) {
  if (!poly || poly.length < 2) return;
  const arr = [];
  for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length];
    arr.push(a[0], 0.05, a[1], b[0], 0.05, b[1]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(arr, 3));
  group.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: 0x9aa4b2 })));
}
function addSolidWalls(group, bits) {
  if (!bits) return 0;
  const rows = grid.rows, cols = grid.cols;
  let n = 0;
  for (let r = 0; r < rows; r++) {
    const row = r * cols;
    let c = 0;
    while (c < cols) {
      if (!bits[row + c]) { c++; continue; }
      let e = c + 1;
      while (e < cols && bits[row + e]) e++;
      n++;
      c = e;
    }
  }
  if (!n) return 0;
  const mesh = new THREE.InstancedMesh(wallUnit, new THREE.MeshStandardMaterial({ color: COLORS.wall }), n);
  mesh.frustumCulled = false;
  const dummy = new THREE.Object3D();
  const cell = grid.cell;
  let i = 0;
  for (let r = 0; r < rows; r++) {
    const row = r * cols;
    let c = 0;
    while (c < cols) {
      if (!bits[row + c]) { c++; continue; }
      let e = c + 1;
      while (e < cols && bits[row + e]) e++;
      const len = e - c;
      dummy.position.set(grid.origin_x + (c + len / 2) * cell, WALL_H / 2, grid.origin_y + (r + 0.5) * cell);
      dummy.rotation.set(0, 0, 0);
      dummy.scale.set(len * cell, 1, cell);
      dummy.updateMatrix();
      mesh.setMatrixAt(i++, dummy.matrix);
      c = e;
    }
  }
  mesh.instanceMatrix.needsUpdate = true;
  group.add(mesh);
  return n;
}
function greedyWallRects(bits, rows, cols) {
  const used = new Uint8Array(rows * cols);
  const rects = [];
  for (let r = 0; r < rows; r++) {
    let c = 0;
    while (c < cols) {
      const i0 = r * cols + c;
      if (!bits[i0] || used[i0]) { c++; continue; }
      let e = c + 1;
      while (e < cols && bits[r * cols + e] && !used[r * cols + e]) e++;
      let r2 = r + 1;
      while (r2 < rows) {
        const base = r2 * cols;
        if (c > 0 && bits[base + c - 1] && !used[base + c - 1]) break;
        if (e < cols && bits[base + e] && !used[base + e]) break;
        let same = true;
        for (let k = c; k < e; k++) {
          if (!bits[base + k] || used[base + k]) { same = false; break; }
        }
        if (!same) break;
        r2++;
      }
      for (let rr = r; rr < r2; rr++) {
        const base = rr * cols;
        for (let k = c; k < e; k++) used[base + k] = 1;
      }
      rects.push({ c, r, w: e - c, h: r2 - r });
      c = e;
    }
  }
  return rects;
}
function addDisplayWalls(group, bits, disp) {
  if (!bits) return 0;
  const rects = greedyWallRects(bits, disp.rows, disp.cols);
  const n = rects.length;
  if (!n) return 0;
  const mesh = new THREE.InstancedMesh(wallUnit, new THREE.MeshStandardMaterial({ color: COLORS.wall }), n);
  mesh.frustumCulled = false;
  const dummy = new THREE.Object3D();
  const res = disp.res;
  for (let i = 0; i < n; i++) {
    const rc = rects[i];
    dummy.position.set(disp.origin_x + (rc.c + rc.w / 2) * res, WALL_H / 2, disp.origin_y + (rc.r + rc.h / 2) * res);
    dummy.rotation.set(0, 0, 0);
    dummy.scale.set(rc.w * res, 1, rc.h * res);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  group.add(mesh);
  return n;
}

function buildBuilding() {
  floorGroups.forEach((g) => { scene.remove(g); clearGroup(g); });
  floorGroups.clear();
  roomMeshes.clear();
  hazardMeshes.clear();
  plates.length = 0;
  clearGroup(verticalGroup);
  clearGroup(routeGroup);
  clearGroup(allRoutesGroup);
  stairMats.length = 0;
  if (cellGeom) cellGeom.dispose();
  cellGeom = new THREE.PlaneGeometry(grid.cell * 0.92, grid.cell * 0.92);
  cellGeom.rotateX(-Math.PI / 2);
  cellGeom.userData.shared = true;

  for (const fl of building.floors) {
    const g = new THREE.Group();
    g.userData.level = fl.level;

    if (fl.outline && fl.outline.length >= 3) {
      const plate = new THREE.Mesh(flatGeom(fl.outline),
        new THREE.MeshStandardMaterial({ color: COLORS.floor, side: THREE.DoubleSide }));
      plate.position.y = -0.02;
      plate.userData = { level: fl.level, kind: "plate" };
      g.add(plate);
      plates.push(plate);
      addOutline(g, fl.outline);
    }

    for (const s of fl.spaces) {
      if (!s.polygon || s.polygon.length < 3) continue;
      const base = COLORS[s.type] ?? COLORS.room;
      const m = new THREE.Mesh(flatGeom(s.polygon),
        new THREE.MeshStandardMaterial({ color: base, side: THREE.DoubleSide }));
      m.userData = { level: fl.level, kind: "room", id: s.id, base };
      g.add(m);
      roomMeshes.set(s.id, m);
      if (namedSpace(s)) {
        const [cx, cy] = centroid(s.polygon);
        const full = (s.label || "").trim();
        g.add(makeLabel(roomNumber(full), full, cx, 0.3, cy));
      }
    }

    const thin = displayGrid && displayMask.get(fl.level);
    const wallN = thin ? addDisplayWalls(g, thin, displayGrid) : addSolidWalls(g, solidMask.get(fl.level));
    g.userData.wallInstances = wallN;

    for (const d of (fl.doors || []).filter((d) => d.exterior_exit)) {
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.5, WALL_H * 1.8, 0.5),
        new THREE.MeshStandardMaterial({ color: COLORS.exit, emissive: COLORS.exit, emissiveIntensity: 0.4 }));
      post.position.set(d.x, WALL_H * 0.9, d.y);
      g.add(post);
      g.add(makeLabel("EXIT", "EXIT", d.x, WALL_H * 2.1, d.y, "#3fb950"));
    }

    const cap = countOn(walkMask.get(fl.level));
    const fire = new THREE.InstancedMesh(cellGeom,
      new THREE.MeshBasicMaterial({ color: COLORS.fire, transparent: true, opacity: 0.9 }), cap);
    const smoke = new THREE.InstancedMesh(cellGeom,
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55, depthWrite: false }), cap);
    fire.count = 0;
    smoke.count = 0;
    fire.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    smoke.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    smoke.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3), 3);
    smoke.instanceColor.setUsage(THREE.DynamicDrawUsage);
    fire.position.y = 0.06;
    smoke.position.y = 0.05;
    fire.frustumCulled = false;
    smoke.frustumCulled = false;
    g.add(fire);
    g.add(smoke);
    hazardMeshes.set(fl.level, { fire, smoke, fireCap: cap, smokeCap: cap });

    scene.add(g);
    floorGroups.set(fl.level, g);
  }
  layoutFloors();
  frameCamera();
}

function layoutFloors() {
  for (const [lv, g] of floorGroups) g.position.y = levelY(lv);
  buildVerticals();
  buildFlightSteps();
  applyFloorFilter();
  if (lastState) applyState(lastState);
  if (lastStart && cachedRoute) drawSelected(lastStart.level, lastStart.x, lastStart.y, cachedRoute);
  if (cachedAll) drawAllLines(cachedAll);
}

function linkLevels(link) {
  if (!link._lvs) {
    link._lvs = Object.keys(link.points || {}).map(Number).filter((n) => !Number.isNaN(n)).sort((a, b) => a - b);
  }
  return link._lvs;
}
function stairColor(st) {
  if (st === "fire") return COLORS.fire;
  if (st === "smoke") return COLORS.smoke;
  if (st === "blocked") return 0x7a1f1f;
  return COLORS.safe;
}
function flightSteps(pLo, pHi, y0, y1) {
  const ax = pLo[0], az = pLo[1], bx = pHi[0], bz = pHi[1];
  const dx = bx - ax, dz = bz - az;

function rampClimb(pLo, pHi, y0, y1) {
  const pts = [];
  for (let i = 0; i <= HALL_TIERS; i++) {
    const t = i / HALL_TIERS;
    pts.push(new THREE.Vector3(
      pLo[0] + (pHi[0] - pLo[0]) * t,
      y0 + (y1 - y0) * t + 0.5,
      pLo[1] + (pHi[1] - pLo[1]) * t

}
function climbPoints(lvA, xA, zA, lvB, xB, zB) {

  const aHi = lvA === hiLv ? [xA, zA] : [xB, zB];
  let best = null, bestD = Infinity;
  for (const link of gridLinks) {
    const kind = (link.type || "").toLowerCase();
    if (kind !== "stairs" && kind !== "stair" && kind !== "ramp") continue;
    const lvs = linkLevels(link);
    const iLo = lvs.indexOf(loLv);
    if (iLo < 0 || lvs[iLo + 1] !== hiLv) continue;
    const pLo = link.points[String(loLv)];
    const pHi = link.points[String(hiLv)];
    if (!pLo || !pHi) continue;
    const d = Math.hypot(pLo[0] - aLo[0], pLo[1] - aLo[1]) + Math.hypot(pHi[0] - aHi[0], pHi[1] - aHi[1]);
    if (d < bestD) { bestD = d; best = { kind, id: link.id, pLo, pHi }; }
  }
  if (!best || bestD > 15) return [];
  const y0 = levelY(loLv), y1 = levelY(hiLv);
  let pts;
  if (best.kind === "ramp") pts = rampClimb(best.pLo, best.pHi, y0, y1);
  else if (best.id === "STAIR-2") {
    const cx = best.pLo[0], cz = best.pLo[1];
    const rad = (SPIRAL_R + 0.16) / 2;
    const dTheta = (Math.PI * 2) / SPIRAL_N;
    const riser = (y1 - y0) / SPIRAL_N;
    pts = [new THREE.Vector3(cx, y0 + 0.35, cz)];
    for (let k = 0; k < SPIRAL_N; k++) {
      const ang = k * dTheta + dTheta * 0.45;
      pts.push(new THREE.Vector3(cx + Math.cos(ang) * rad, y0 + (k + 0.5) * riser + 0.12, cz + Math.sin(ang) * rad));
    }
    pts.push(new THREE.Vector3(best.pHi[0], y1 + 0.35, best.pHi[1]));
  } else {
    const land = stairLandings.find((L) => L.id === best.id && L.lo === loLv && L.hi === hiLv);
    if (land) {
      pts = [
        new THREE.Vector3(best.pLo[0], y0 + 0.35, best.pLo[1]),
        new THREE.Vector3(land.cx, land.y + 0.35, land.cz),
        new THREE.Vector3(best.pHi[0], y1 + 0.35, best.pHi[1]),
      ];
    } else {
      const steps = flightSteps(best.pLo, best.pHi, y0, y1);
      pts = [new THREE.Vector3(best.pLo[0], y0 + 0.35, best.pLo[1])];
      for (const s of steps) pts.push(new THREE.Vector3(s.x, s.y + s.h / 2 + 0.08, s.z));
      pts.push(new THREE.Vector3(best.pHi[0], y1 + 0.35, best.pHi[1]));
    }

  return pts;
}
function pathPoints(path) {
  const out = [];
  if (!path) return out;
  for (let i = 0; i < path.length; i++) {
    const lv = path[i][0], x = path[i][1], y = path[i][2];
    if (i > 0 && path[i - 1][0] !== lv) {
      const prev = path[i - 1];
      const extra = climbPoints(prev[0], prev[1], prev[2], lv, x, y);
      for (const p of extra) out.push(p);

  }

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => {
  if (e.button !== 0) return;
  downAt = [e.clientX, e.clientY];
});
renderer.domElement.addEventListener("pointerup", (e) => {
  if (e.button !== 0 || !downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved > 5 || !grid) return;
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(plates.filter((m) => m.parent && m.parent.visible), false);
  if (!hits.length) return;
  const h = hits[0];
  const level = h.object.userData.level;
  const spot = snapWalkable(level, h.point.x, h.point.z);
  if (!spot) { showToast("That is a wall"); return; }
  const job = ignite
    ? () => placeFire(level, spot.x, spot.y)
    : () => routeFrom(level, spot.x, spot.y);
  enqueue(job).catch((err) => showToast(err.message));
});

function stopPlay() {

  playToken++;

async function playLoop(token) {
  while (playing && token === playToken) {
    const t0 = performance.now();
    let failed = false;
    await enqueue(async () => {
      if (!playing || token !== playToken) return;
      try {
        await post("/api/fire/step", { n: speedN() });
        applyState(await api("/api/state"));
        playTick++;
        await refreshSelected();
        if (showAll && playTick % 3 === 0) await refreshAll();
      } catch (err) {
        console.error(err);
        failed = true;
        showToast(err.message || "Sim step failed");
      }
    });
    if (failed || !playing || token !== playToken) break;
    const wait = TICK_MS - (performance.now() - t0);
    if (wait > 0) await sleep(wait);
  }
}

  renderer.domElement.style.cursor = ignite ? "crosshair" : "";
};
function setFireMode(mode) {
  enqueue(async () => {
    await post("/api/fire/mode", { mode });
    applyState(await api("/api/state"));
  }).catch((e) => showToast(e.message));
}
$("modeSim").onclick = () => setFireMode("simulate");
$("modeRep").onclick = () => setFireMode("reports");
$("btnStep").onclick = () => {
  if (playing) return;
  enqueue(async () => {
    await post("/api/fire/step", { n: speedN() });
    await afterFireChange();
  }).catch((e) => showToast(e.message));
};
$("btnReset").onclick = () => {
  stopPlay();
  enqueue(async () => {
    await post("/api/fire/reset");
    await afterFireChange();
  }).catch((e) => showToast(e.message));
};
$("btnPlay").onclick = () => {
  if (playing) { stopPlay(); return; }
  playing = true;
  const token = ++playToken;
  $("btnPlay").textContent = "Pause";
  $("btnPlay").classList.add("on");
  playLoop(token);
};
$("gap").oninput = (e) => {
  gap = parseFloat(e.target.value);
  layoutFloors();
};
$("floorSel").onchange = () => { applyFloorFilter(); };
$("btnLabels").onclick = (e) => {
  e.target.classList.toggle("on");
  applyLabelVisibility();
  labelDomDirty = true;
};
$("btnAll").onclick = () => {
  showAll = !showAll;
  $("btnAll").classList.toggle("on", showAll);
  if (!showAll) {
    cachedAll = null;
    clearGroup(allRoutesGroup);
    return;
  }
  enqueue(() => refreshAll()).catch((e) => showToast(e.message));
};

async function boot() {
  building = await api("/api/building");
  const occ = await api("/api/grid");
  grid = building.grid;
  levels = grid.levels;
  gridLinks = occ.links || [];
  const n = grid.rows * grid.cols;
  walkMask.clear();
  solidMask.clear();
  displayMask.clear();
  displayGrid = (occ.display && occ.display.res > 0 && occ.display.rows > 0 && occ.display.cols > 0 && occ.display.levels)
    ? occ.display : null;
  const dn = displayGrid ? displayGrid.rows * displayGrid.cols : 0;
  for (const lv of levels) {
    const entry = occ.levels && occ.levels[String(lv)];
    if (entry) {
      walkMask.set(lv, decodeBits(entry.walkable, n));
      solidMask.set(lv, decodeBits(entry.solid, n));
    }
    if (displayGrid && displayGrid.levels[String(lv)]) displayMask.set(lv, decodeBits(displayGrid.levels[String(lv)], dn));
  }
  $("bname").textContent = `${building.building} · ${levels.length} floor${levels.length > 1 ? "s" : ""}`;
  const sel = $("roomSel");
  sel.innerHTML = "";
  const named = [];
  for (const fl of building.floors) {
    for (const s of fl.spaces) {
      if (!namedSpace(s)) continue;
      named.push({ level: fl.level, s, num: roomNumber(s.label) });
    }
  }
  named.sort((a, b) => a.level - b.level || a.num.localeCompare(b.num, undefined, { numeric: true }));
  for (const { level, s } of named) {
    const o = document.createElement("option");
    o.value = s.id;
    o.textContent = `F${level} ${s.label}`;
    sel.appendChild(o);
  }
  for (const lv of levels) {
    const o = document.createElement("option");
    o.value = lv;
    o.textContent = `Floor ${lv}`;
    $("floorSel").appendChild(o);
  }
  if (building.warnings?.length) {
    $("warnSec").style.display = "";
    $("warn").textContent = building.warnings.join("\n");
  }
  buildBuilding();
  const wallNote = levels.map((lv) => "F" + lv + ":" + (floorGroups.get(lv)?.userData.wallInstances || 0)).join(" ");
  console.info("wall instances (" + (displayGrid ? "display" : "solid") + ") " + wallNote);
  applyState(await api("/api/state"));
}

function animate() {
  requestAnimationFrame(animate);
  const t = performance.now() / 1000;
  for (const hm of hazardMeshes.values()) hm.fire.material.opacity = 0.7 + 0.25 * Math.sin(t * 6);
  if (grid) {
    const far = camera.position.distanceTo(controls.target) > labelFarLimit();
    if (far !== labelsFar) {
      labelsFar = far;
      applyLabelVisibility();
      labelDomDirty = true;
    }
  }
  controls.update();
  renderer.render(scene, camera);
  const showLabels = $("btnLabels").classList.contains("on") && !labelsFar;
  const showMarks = ghostGroup.children.length > 0;
  if (showLabels || showMarks || labelDomDirty) {
    labelRenderer.render(scene, camera);
    if (!showLabels && !showMarks) labelDomDirty = false;
  }
}
animate();
boot().catch((e) => { $("bname").textContent = "Failed to load: " + e.message; console.error(e); });
</script>
</body>
</html>
