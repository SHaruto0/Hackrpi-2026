<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firesight Commander</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --line: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --fire: #ff4d3d;
    --smoke: #d9a441;
    --safe: #3fb950;
    --route: #58a6ff;
    --blocked: #6e1414;
    --victim: #8957e5;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .finder { position: relative; flex: 1 1 280px; max-width: 460px; min-width: 160px; }
  #roomFind { width: 100%; }
  #findBox {
    position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; right: 0;
    max-height: 340px; overflow: auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  }
  #findBox[hidden] { display: none !important; }
  .find-hit { padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .find-hit:hover, .find-hit.on { background: #21262d; }
  .find-meta { color: var(--muted); font-size: 12px; }
  .find-act { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .find-empty { margin: 0; padding: 8px 10px; }
  .mode { display: flex; align-items: center; }
  .mode button { border-radius: 0; }
  .mode button:first-child { border-radius: 6px 0 0 6px; }
  .mode button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  #modeLabel { min-width: 4.5em; }
  h1 { font-size: 16px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; min-height: 24px; }
  .chev {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; border: 0; padding: 0; color: inherit;
    font: inherit; font-weight: 600; cursor: pointer; text-align: left;
  }
  .chev-icon {
    width: 0; height: 0; flex: 0 0 auto;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 6px solid var(--muted);
    transition: transform .2s ease;
  }
  section.collapsed .chev-icon { transform: rotate(-90deg); }
  .panel-tools { display: flex; gap: 6px; }
  .sub, .k, .model { color: var(--muted); }
  .sub { font-size: 12px; }
  .model { font-size: 11px; margin-top: 6px; min-height: 14px; }
  .links { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: flex-end; }
  a { color: var(--route); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge { padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .badge.off { color: var(--muted); }
  .badge.hot { background: #da3633; border-color: #da3633; color: #fff; }
  .badge.live { background: #238636; border-color: #238636; color: #fff; }
  main {
    flex: 1; min-height: 0; overflow: auto;
    display: grid;
    grid-template-columns: minmax(230px, 1fr) minmax(240px, 1fr) minmax(270px, 1.12fr);
    grid-template-rows: auto auto auto auto;
    grid-template-areas:
      "build build build"
      "brief people reports"
      "ask people reports"
      "controls timeline search";
    align-items: start;
    gap: 12px; padding: 12px;
  }
  section {
    --open-h: 240px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; min-width: 0; min-height: 0; width: 100%;
    height: var(--open-h);
    display: flex; flex-direction: column; overflow: hidden;
    align-self: start;
    transition: height .28s ease;
  }
  section.collapsed { height: 46px; padding-top: 8px; padding-bottom: 8px; }
  section.collapsed h2 { margin-bottom: 0; }
  section.resizing { transition: none; }
  .panel-body {
    flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  }
  #buildSec { grid-area: build; --open-h: var(--build-h, 55vh); }
  #briefSec { grid-area: brief; }
  #askSec { grid-area: ask; }
  #controlsSec { grid-area: controls; }
  #peopleSec { grid-area: people; }
  #timeSec { grid-area: timeline; }
  #reportsSec { grid-area: reports; }
  #searchSec { grid-area: search; }
  #peopleSec, #reportsSec { --open-h: calc(240px * 2 + 12px); }
  .victim-alert {
    position: sticky; top: 0; z-index: 5;
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 14px; background: #da3633; color: #fff; font-weight: 600;
  }
  .victim-alert p { flex: 1; min-width: 0; }
  .victim-alert button { background: #fff; color: #9a1c1c; border-color: #fff; font-weight: 700; flex: 0 0 auto; }
  .victim-alert[hidden] { display: none !important; }
  .scroll { overflow: auto; flex: 1; min-height: 0; }
  #brief, #answer { white-space: pre-wrap; }
  #buildFrame { flex: 1; width: 100%; min-height: 0; border: 0; background: #0e1116; }
  #buildResize {
    flex: 0 0 10px; margin: 8px -12px -10px; cursor: ns-resize; touch-action: none;
    background: transparent; border-top: 1px solid var(--line);
  }
  #buildResize:hover, #buildResize.drag { background: #1f6feb; }
  section.collapsed #buildResize { display: none; }
  button, select, input {
    font: inherit; background: #21262d; color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
  }
  button { cursor: pointer; }
  button:hover { border-color: #8b949e; }
  button:disabled { opacity: 0.55; cursor: default; }
  button.primary { background: #da3633; border-color: #da3633; }
  button.on { background: #1f6feb; border-color: #1f6feb; }
  h2 button#radio { margin-left: auto; padding: 3px 8px; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 6px; }
  select, #q, #radioText { flex: 1; min-width: 0; width: 100%; }
  #radioMsg { min-height: 18px; margin: 4px 0 6px; }
  #stepN { width: 64px; }
  #ctrlMsg { min-height: 18px; margin-top: 6px; }
  .bad { color: var(--fire); }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
  tr.trapped td { background: rgba(255, 77, 61, 0.12); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
  .chip {
    display: inline-block; background: #21262d; border: 1px solid var(--line);
    border-radius: 999px; padding: 2px 8px; margin: 4px 4px 0 0; font-size: 11px;
  }
  .chip.kind-fire { background: var(--fire); border-color: var(--fire); color: #fff; }
  .chip.kind-smoke { background: var(--smoke); border-color: var(--smoke); color: #1c1406; }
  .chip.kind-blocked { background: var(--blocked); border-color: var(--blocked); color: #fff; }
  .chip.kind-clear, .chip.kind-searched { background: #2ea043; border-color: #2ea043; color: #fff; }
  .chip.kind-victim { background: var(--victim); border-color: var(--victim); color: #fff; }
  .rep-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .rep-by { font-weight: 600; }
  .rep-text { margin-top: 2px; overflow-wrap: anywhere; }
  .changes { margin: 4px 0 0; padding-left: 16px; color: var(--muted); }
  .changes li { margin: 1px 0; overflow-wrap: anywhere; }
  .floor-prog { margin-bottom: 10px; }
  .bar {
    height: 8px; margin: 4px 0; background: #21262d; border: 1px solid var(--line);
    border-radius: 99px; overflow: hidden;
  }
  .bar > i { display: block; height: 100%; background: var(--safe); }
  .todo { color: var(--muted); font-size: 12px; }
  details { margin-top: 6px; color: var(--muted); font-size: 11px; }
  #facts { max-height: 72px; overflow: auto; margin-top: 4px; white-space: pre-wrap; }
  .ev { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .ev-k { font-weight: 600; }
  .ev-fire { color: var(--fire); }
  .ev-person { color: var(--route); }
  .ev-t { color: var(--muted); font-size: 11px; }
  p { margin: 0; }
  @media (max-width: 1080px), (max-height: 720px) {
    body { overflow: auto; height: auto; }
    main { display: flex; flex-direction: column; height: auto; }
    #peopleSec, #reportsSec { --open-h: 280px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Firesight Commander</h1>
    <div class="sub" id="bname">Loading building...</div>
  </div>
  <div class="finder">
    <input id="roomFind" type="search" placeholder="Find a room by number or name" autocomplete="off" spellcheck="false" aria-label="Find a room">
    <div id="findBox" hidden></div>
  </div>
  <div class="links">
    <div class="panel-tools">
      <button id="collapseAll" type="button">Collapse all</button>
      <button id="expandAll" type="button">Expand all</button>
    </div>
    <div class="mode" role="group" aria-label="Fire mode">
      <button id="modeSim" type="button" aria-pressed="true">Simulate</button>
      <button id="modeRep" type="button" aria-pressed="false">Reports only</button>
    </div>
    <span id="modeLabel" class="k">simulate</span>
    <span class="k">Sim step <b id="tval">0</b></span>
    <span id="fireBadge" class="badge off">No fire</span>
    <span id="linkBadge" class="badge off">Polling</span>
    <a href="/">3D view</a>
    <a href="/editor.html">Map editor</a>
  </div>
</header>
<div id="victimAlert" class="victim-alert" hidden role="alert">
  <p id="victimText"></p>
  <button id="victimAck" type="button">Acknowledge</button>
</div>
<main>
  <section id="buildSec" data-panel="build">
    <h2><button type="button" class="chev" aria-expanded="true" aria-controls="buildBody"><i class="chev-icon" aria-hidden="true"></i>Building (3D)</button></h2>
    <div class="panel-body" id="buildBody">
      <iframe id="buildFrame" title="Building 3D" src="/index.html?embed=1"></iframe>
      <div id="buildResize" role="separator" aria-orientation="horizontal" aria-label="Resize building view"></div>
    </div>
  </section>

  <section id="briefSec" data-panel="brief">
    <h2><button type="button" class="chev" aria-expanded="true" aria-controls="briefBody"><i class="chev-icon" aria-hidden="true"></i>Briefing</button> <button id="radio" type="button" aria-pressed="false">Radio</button></h2>
    <div class="panel-body" id="briefBody">
    <div id="brief" class="scroll">Loading briefing...</div>
    <div id="model" class="model"></div>
    <details>
      <summary>Facts</summary>
      <div id="facts"></div>
    </details>
    </div>
  </section>

  <section id="askSec" data-panel="ask">
    <h2><button type="button" class="chev" aria-expanded="true" aria-controls="askBody"><i class="chev-icon" aria-hidden="true"></i>Ask</button></h2>
    <div class="panel-body" id="askBody">
    <form id="askForm" class="row">
      <input id="q" type="text" placeholder="Which stairs are safe?" autocomplete="off" spellcheck="false">
      <button type="submit">Ask</button>
    </form>
    <div id="answer" class="scroll" role="status"></div>
    <div id="askModel" class="model"></div>
    <div id="sources"></div>
    </div>
  </section>

  <section id="controlsSec" data-panel="controls">
    <h2><button type="button" class="chev" aria-expanded="true" aria-controls="controlsBody"><i class="chev-icon" aria-hidden="true"></i>Controls</button></h2>
    <div class="panel-body" id="controlsBody">
    <div class="row"><select id="roomSel" aria-label="Room to ignite"></select></div>
    <div class="row">
      <button class="primary" id="btnFire" type="button">Start fire</button>
      <label class="k" for="stepN">Steps</label>
      <input id="stepN" type="number" min="1" max="50" value="1">
      <button id="btnStep" type="button">Step</button>
      <button id="btnReset" type="button">Reset</button>
    </div>
    <div id="ctrlMsg" class="k" role="status"></div>
    </div>
  </section>

  <section id="peopleSec" data-panel="people">
    <h2><button type="button" class="chev" aria-expanded="true" aria-controls="peopleBody"><i class="chev-icon" aria-hidden="true"></i>People <span id="peopleCount" class="k"></span></button></h2>
    <div class="panel-body" id="peopleBody">
    <div id="people" class="scroll"></div>
    </div>
  </section>

  <section id="timeSec" data-panel="timeline">
    <h2><button type="button" class="chev" aria-expanded="true" aria-controls="timeBody"><i class="chev-icon" aria-hidden="true"></i>Timeline</button></h2>
    <div class="panel-body" id="timeBody">
    <div id="timeline" class="scroll">Loading history...</div>
    </div>
  </section>

  <section id="reportsSec" data-panel="reports">
    <h2><button type="button" class="chev" aria-expanded="true" aria-controls="reportsBody"><i class="chev-icon" aria-hidden="true"></i>Field reports</button></h2>
    <div class="panel-body" id="reportsBody">
    <form id="radioForm" class="row">
      <input id="radioText" type="text" placeholder="Radio report" aria-label="Radio report" autocomplete="off" spellcheck="false">
      <button type="submit">Send</button>
    </form>
    <div id="radioMsg" class="k" role="status"></div>
    <div id="reports" class="scroll">Loading reports...</div>
    </div>
  </section>

  <section id="searchSec" data-panel="search">
    <h2><button type="button" class="chev" aria-expanded="true" aria-controls="searchBody"><i class="chev-icon" aria-hidden="true"></i>Search progress</button></h2>
    <div class="panel-body" id="searchBody">
    <div id="search" class="scroll">Loading search progress...</div>
    </div>
  </section>
</main>

<script>
(function () {
  const KIND_LABEL = {
    fire_start: "Fire started",
    fire_step: "Fire stepped",
    fire_reset: "Fire reset",
    person_status: "Check-in",
  };
  const STATUS_ORDER = { trapped: 0, evacuating: 1, safe: 2 };
  const SKIP_TYPES = new Set(["stairwell", "elevator", "void"]);
  const NUM_WORDS = {
    one: 1, two: 2, three: 3, four: 4, five: 5,
    six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
  };

  let building = null;
  let state = { t: 0, rooms: {}, verticals: {}, origins: [] };
  let people = [];
  let roomById = {};
  let selectedId = "";
  let findPick = "";
  let fireRunning = false;
  let briefBusy = false;
  let briefQueued = false;
  let timelineSig = "";
  let pollTail = Promise.resolve();
  let timeTail = Promise.resolve();
  let reportTail = Promise.resolve();
  let reports = [];
  let reportsLive = false;
  let linkLive = false;
  let liveSock = null;
  let liveWait = 0;
  let liveTries = 0;
  let timerLive = 0;
  let timerTime = 0;
  let timerReports = 0;
  let searchLive = false;
  let searchedIds = new Set();
  let unsearchedItems = [];
  let searchListed = false;
  const ackedVictims = new Set();
  let openVictimKeys = [];

  const $ = (id) => document.getElementById(id);

  function detailOf(data, fallback) {
    const d = data && data.detail;
    if (typeof d === "string" && d && d[0] !== "<") return d;
    if (Array.isArray(d)) return d.map((x) => (x && x.msg) || JSON.stringify(x)).join("; ");
    return fallback;
  }

  async function readBody(res) {
    const text = await res.text();
    if (!text) return {};
    try { return JSON.parse(text); }
    catch { return { detail: text.slice(0, 180) }; }
  }

  async function postJSON(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      cache: "no-store",
      body: body == null ? undefined : JSON.stringify(body),
    });
    return { res, data: await readBody(res) };
  }

  function num(v) {
    const n = +v;
    return Number.isFinite(n) ? n : NaN;
  }

  function timeMs(v) {
    if (v == null || v === "") return NaN;
    if (typeof v === "number") return v > 1e12 ? v : v * 1000;
    const t = Date.parse(v);
    return Number.isNaN(t) ? NaN : t;
  }

  function ageOf(v) {
    const ms = timeMs(v);
    if (!Number.isFinite(ms)) return "unknown";
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 5) return "just now";
    if (s < 60) return s + "s ago";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60);
    if (h < 48) return h + "h ago";
    return Math.floor(h / 24) + "d ago";
  }

  function fmtTs(v) {
    const ms = timeMs(v);
    if (!Number.isFinite(ms)) return v == null ? "" : String(v);
    return new Date(ms).toLocaleString([], {
      month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit",
    });
  }

  function clock() {
    return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
  }

  function personColor(status) {
    if (status === "trapped") return "#ff4d3d";
    if (status === "safe") return "#3fb950";
    if (status === "evacuating") return "#58a6ff";
    return "#c9d1d9";
  }

  function roomName(id) {
    if (id == null || id === "") return "";
    const s = roomById[id];
    if (!s) return String(id);
    return s.label || s.id;
  }

  function isFireRunning(s) {
    if (!s || typeof s !== "object") return false;
    if (Number(s.t) > 0) return true;
    if (Array.isArray(s.origins) && s.origins.length) return true;
    for (const v of Object.values(s.rooms || {})) if (v === "fire" || v === "smoke") return true;
    for (const v of Object.values(s.verticals || {})) if (v === "fire" || v === "smoke") return true;
    return false;
  }

  function indexRooms() {
    roomById = {};
    for (const fl of building.floors || []) {
      for (const s of fl.spaces || []) {
        if (!s || s.id == null) continue;
        roomById[s.id] = s;
        s.level = fl.level;
      }
    }
  }

  function fillRooms() {
    const sel = $("roomSel");
    const items = Object.values(roomById).sort((a, b) => {
      const dl = num(a.level) - num(b.level);
      if (dl) return dl;
      return String(a.label || a.id).localeCompare(String(b.label || b.id), undefined, { numeric: true });
    });
    sel.replaceChildren();
    if (!items.length) {
      const o = document.createElement("option");
      o.value = "";
      o.textContent = "No rooms";
      sel.appendChild(o);
      selectedId = "";
      return;
    }
    for (const s of items) {
      const o = document.createElement("option");
      o.value = s.id;
      const label = s.label && s.label !== s.id ? s.label : s.id;
      o.textContent = "Floor " + s.level + ", " + label + (s.type ? " (" + s.type + ")" : "");
      sel.appendChild(o);
    }
    if (!roomById[selectedId]) selectedId = items[0].id;
    sel.value = selectedId;
  }

  function whereText(p) {
    const bits = [];
    if (p.room_id) bits.push(roomName(p.room_id));
    if (p.level != null && p.level !== "") bits.push("floor " + p.level);
    if (!bits.length && p.x != null && p.y != null) {
      const x = num(p.x), y = num(p.y);
      if (Number.isFinite(x) && Number.isFinite(y)) bits.push(x.toFixed(1) + ", " + y.toFixed(1));
    }
    return bits.join(", ") || "Unknown";
  }

  function renderPeople() {
    const wrap = $("people");
    const rows = people.slice().sort((a, b) => {
      const d = (STATUS_ORDER[a.status] ?? 9) - (STATUS_ORDER[b.status] ?? 9);
      if (d) return d;
      return (timeMs(b.updated_at) || 0) - (timeMs(a.updated_at) || 0);
    });
    const tally = { trapped: 0, evacuating: 0, safe: 0 };
    for (const p of rows) if (tally[p.status] != null) tally[p.status] += 1;
    const bits = [];
    if (tally.trapped) bits.push(tally.trapped + " trapped");
    if (tally.evacuating) bits.push(tally.evacuating + " evacuating");
    if (tally.safe) bits.push(tally.safe + " safe");
    $("peopleCount").textContent = bits.join(", ");
    wrap.replaceChildren();
    if (!rows.length) {
      const empty = document.createElement("p");
      empty.className = "k";
      empty.textContent = "No check-ins yet.";
      wrap.appendChild(empty);
      return;
    }
    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const hr = document.createElement("tr");
    for (const h of ["Status", "Person", "Where", "Updated"]) {
      const th = document.createElement("th");
      th.scope = "col";
      th.textContent = h;
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    const tb = document.createElement("tbody");
    for (const person of rows) {
      const tr = document.createElement("tr");
      if (person.status === "trapped") tr.className = "trapped";
      const status = document.createElement("td");
      const dot = document.createElement("i");
      dot.className = "dot";
      dot.style.background = personColor(person.status);
      const name = document.createElement("span");
      name.textContent = person.status || "unknown";
      name.style.color = personColor(person.status);
      status.append(dot, name);
      const who = document.createElement("td");
      who.textContent = person.person_id || "Unknown";
      const where = document.createElement("td");
      where.textContent = whereText(person);
      if (person.x != null && person.y != null) {
        const x = num(person.x), y = num(person.y);
        if (Number.isFinite(x) && Number.isFinite(y)) where.title = x.toFixed(1) + ", " + y.toFixed(1);
      }
      const when = document.createElement("td");
      when.textContent = ageOf(person.updated_at);
      tr.append(status, who, where, when);
      tb.appendChild(tr);
    }
    table.append(thead, tb);
    wrap.appendChild(table);
  }

  function kindLabel(kind) {
    if (!kind) return "Event";
    if (KIND_LABEL[kind]) return KIND_LABEL[kind];
    return String(kind).replaceAll("_", " ");
  }

  function eventBits(ev) {
    const parts = [];
    if (ev.person_id) parts.push(String(ev.person_id));
    if (ev.status) parts.push(String(ev.status));
    if (ev.room_id) parts.push(roomName(ev.room_id));
    if (ev.level != null && ev.level !== "") parts.push("floor " + ev.level);
    if (ev.n != null && ev.n !== "") parts.push(ev.n + " steps");
    if (ev.name) parts.push(String(ev.name));
    return parts.join(", ");
  }

  function showTimelineMessage(msg) {
    const sig = "msg:" + msg;
    const box = $("timeline");
    if (timelineSig === sig) return;
    timelineSig = sig;
    box.replaceChildren();
    box.textContent = msg;
  }

  function renderTimeline(events) {
    const sig = events.map((e) => [e && e.ts, e && e.kind, e && e.person_id, e && e.room_id, e && e.status, e && e.n].join(":")).join("|");
    if (sig === timelineSig) return;
    timelineSig = sig;
    const box = $("timeline");
    const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 48;
    box.replaceChildren();
    if (!events.length) {
      box.textContent = "No events yet.";
      return;
    }
    for (const ev of events) {
      if (!ev || typeof ev !== "object") continue;
      const row = document.createElement("div");
      row.className = "ev";
      const k = document.createElement("div");
      const kind = String(ev.kind || "");
      k.className = "ev-k " + (kind.startsWith("fire_") ? "ev-fire" : kind === "person_status" ? "ev-person" : "");
      k.textContent = kindLabel(kind);
      const t = document.createElement("div");
      t.className = "ev-t";
      t.textContent = fmtTs(ev.ts);
      row.append(k, t);
      const bits = eventBits(ev);
      if (bits) {
        const d = document.createElement("div");
        d.textContent = bits;
        row.appendChild(d);
      }
      box.appendChild(row);
    }
    if (stick) box.scrollTop = box.scrollHeight;
  }

  function factText(v) {
    if (v == null || v === "") return "none";
    if (typeof v === "string" || typeof v === "number" || typeof v === "boolean") return String(v);
    if (Array.isArray(v)) {
      if (!v.length) return "none";
      return v.map((item) => {
        if (item == null) return "none";
        if (typeof item !== "object") return String(item);
        return item.label || item.id || item.name || JSON.stringify(item);
      }).join(", ");
    }
    return JSON.stringify(v);
  }

  function renderFacts(facts) {
    const box = $("facts");
    box.replaceChildren();
    if (facts == null || facts === "") {
      box.textContent = "None yet.";
      return;
    }
    if (typeof facts === "string") {
      box.textContent = facts;
      return;
    }
    if (Array.isArray(facts)) {
      for (const item of facts) {
        const line = document.createElement("div");
        line.textContent = factText(item);
        box.appendChild(line);
      }
      return;
    }
    if (typeof facts === "object") {
      for (const [k, v] of Object.entries(facts)) {
        const line = document.createElement("div");
        line.textContent = k + ": " + factText(v);
        box.appendChild(line);
      }
      return;
    }
    box.textContent = String(facts);
  }

  function renderSources(ids) {
    const box = $("sources");
    box.replaceChildren();
    if (!Array.isArray(ids)) return;
    for (const id of ids) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = roomName(id) || String(id);
      if (String(id) !== chip.textContent) chip.title = String(id);
      box.appendChild(chip);
    }
  }

  async function loadBriefOnce() {
    const style = $("radio").classList.contains("on") ? "radio" : "commander";
    const res = await fetch("/api/brief?style=" + encodeURIComponent(style), { cache: "no-store" });
    const data = await readBody(res);
    if (!res.ok) {
      $("brief").textContent = detailOf(data, "Briefing unavailable.");
      $("model").textContent = "";
      renderFacts(null);
      return;
    }
    $("brief").textContent = data.text || "";
    $("model").textContent = (data.model ? "Model: " + data.model + "  " : "") + "Updated " + clock();
    renderFacts(data.facts);
  }

  async function loadBrief() {
    if (briefBusy) { briefQueued = true; return; }
    briefBusy = true;
    try {
      do {
        briefQueued = false;
        try { await loadBriefOnce(); }
        catch { $("brief").textContent = "Briefing unavailable."; }
      } while (briefQueued);
    } finally {
      briefBusy = false;
    }
  }

    fireRunning = isFireRunning(state);
    $("tval").textContent = String(state.t ?? 0);
    const badge = $("fireBadge");

    const [stRes, peRes] = await Promise.all([

  function pollLive() {
    const job = pollTail.then(pollLiveOnce, pollLiveOnce);
    pollTail = job.then(() => {}, () => {});

  }

  async function pollTimelineOnce() {
    const res = await fetch("/api/history/timeline", { cache: "no-store" });
    if (res.status === 503) {
      showTimelineMessage("History needs MongoDB");
      return;
    }
    if (!res.ok) {
      showTimelineMessage("History unavailable.");
      return;
    }
    const data = await readBody(res);
    renderTimeline(Array.isArray(data) ? data : []);
  }

  function pollTimeline() {
    const job = timeTail.then(pollTimelineOnce, pollTimelineOnce);
    timeTail = job.then(() => {}, () => {});
    return job;
  }

  function armPolls() {
    if (timerLive) clearInterval(timerLive);
    if (timerTime) clearInterval(timerTime);
    if (timerReports) clearInterval(timerReports);
    const slow = linkLive ? 10000 : 0;
    timerLive = setInterval(() => { pollLive(); }, slow || 2000);
    timerTime = setInterval(() => { pollTimeline(); }, slow || 2000);
    timerReports = setInterval(() => { pollReports(); }, slow || 3000);
  }

  function setLink(on) {
    const badge = $("linkBadge");
    if (badge) {
      badge.textContent = on ? "Live" : "Polling";
      badge.className = on ? "badge live" : "badge off";
    }
    if (linkLive === on && timerLive) return;
    linkLive = on;
    armPolls();
  }

  function queueLive() {
    if (liveWait) return;
    const delay = Math.min(30000, 1000 * (2 ** liveTries));
    liveTries = Math.min(liveTries + 1, 5);
    liveWait = setTimeout(() => {
      liveWait = 0;
      connectLive();
    }, delay);
  }

  function connectLive() {
    if (liveWait) { clearTimeout(liveWait); liveWait = 0; }
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    let sock;
    try {
      sock = new WebSocket(proto + "//" + location.host + "/ws/live");
    } catch (err) {
      queueLive();
      return;
    }
    liveSock = sock;
    sock.onopen = () => {
      liveTries = 0;
      setLink(true);
    };
    sock.onmessage = (ev) => {
      let msg = null;
      try { msg = JSON.parse(ev.data); } catch (err) { return; }
      if (!msg || typeof msg.kind !== "string" || msg.kind === "ping") return;
      if (msg.kind === "people") pollLive();
      else if (msg.kind === "report") pollReports();
      else if (msg.kind === "fire") {
        pollLive();
        loadBrief();
      }
    };
    sock.onerror = () => {};
    sock.onclose = () => {
      if (liveSock === sock) liveSock = null;
      setLink(false);
      queueLive();
    };
  }

  function setCtrl(msg, isError) {
    const el = $("ctrlMsg");
    el.textContent = msg || "";

  function stepCount() {
    const input = $("stepN");
    let n = parseInt(input.value, 10);
    if (!Number.isFinite(n)) n = 1;
    n = Math.max(1, Math.min(50, n));
    input.value = String(n);
    return n;
  }

  function reportKey(rep) {
    if (rep.id != null && rep.id !== "") return String(rep.id);
    return [rep.t, rep.by, rep.text].join("|");
  }

  function asReportList(data) {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.reports)) return data.reports;
    return [];
  }

  function victimCount(u) {
    if (!u || u.count == null || u.count === "") return 1;
    const n = Math.round(num(u.count));
    if (Number.isFinite(n) && n >= 1) return n;
    return NUM_WORDS[String(u.count).trim().toLowerCase()] || 1;
  }

  function victimPlace(u) {
    if (u.target_label) return String(u.target_label);
    if (u.target_id != null && u.target_id !== "") return roomName(u.target_id);
    return "";
  }

  function victimSentence(count, place) {
    const word = count === 1 ? "victim" : "victims";
    if (!place) return count + " " + word + " reported";
    return count + " " + word + " reported in " + place;
  }

  function updateChipText(u, kind) {
    const target = u.target_label || (u.target_id != null && u.target_id !== "" ? roomName(u.target_id) : "");
    const bits = [];
    if (kind === "victim") {
      const n = victimCount(u);
      bits.push(n === 1 ? "1 victim" : n + " victims");
    } else {
      bits.push(kind);
      if (u.severity) bits.push(String(u.severity));
    }
    if (target) bits.push(String(target));
    return bits.join(" ");
  }

  function changeText(c) {
    if (c == null) return "";
    if (typeof c === "string" || typeof c === "number") return String(c);
    if (typeof c === "object") {
      if (c.text) return String(c.text);
      if (c.change) return String(c.change);
      if (c.detail) return String(c.detail);
      return JSON.stringify(c);
    }
    return String(c);
  }

  function chipKind(u) {
    return String((u && u.kind) || "note").toLowerCase().replace(/[^a-z]/g, "") || "note";
  }

  function renderReports() {
    const box = $("reports");
    const prev = box.scrollTop;
    const nearTop = prev < 28;
    box.replaceChildren();
    if (!reportsLive) {
      box.textContent = "Reports unavailable";
      return;
    }
    if (!reports.length) {
      const empty = document.createElement("p");
      empty.className = "k";
      empty.textContent = "No reports yet.";
      box.appendChild(empty);
      return;
    }
    for (const rep of reports) {
      if (!rep || typeof rep !== "object") continue;
      const row = document.createElement("div");
      row.className = "ev";
      const top = document.createElement("div");
      top.className = "rep-top";
      const by = document.createElement("span");
      by.className = "rep-by";
      by.textContent = rep.by ? String(rep.by) : "Unknown";
      const when = document.createElement("span");
      when.className = "ev-t";
      when.textContent = ageOf(rep.t);
      top.append(by, when);
      row.appendChild(top);
      if (rep.text) {
        const tx = document.createElement("div");
        tx.className = "rep-text";
        tx.textContent = String(rep.text);
        row.appendChild(tx);
      }
      const updates = Array.isArray(rep.updates) ? rep.updates : [];
      if (updates.length) {
        const chips = document.createElement("div");
        for (const u of updates) {
          if (!u || typeof u !== "object") continue;
          const kind = chipKind(u);
          const chip = document.createElement("span");
          chip.className = "chip kind-" + kind;
          chip.textContent = updateChipText(u, kind);
          chips.appendChild(chip);
        }
        if (chips.childNodes.length) row.appendChild(chips);
      }
      const changes = Array.isArray(rep.changes) ? rep.changes : [];
      if (changes.length) {
        const ul = document.createElement("ul");
        ul.className = "changes";
        for (const c of changes) {
          const li = document.createElement("li");
          li.textContent = changeText(c);
          ul.appendChild(li);
        }
        row.appendChild(ul);
      }
      box.appendChild(row);
    }
    box.scrollTop = nearTop ? 0 : prev;
  }

  function renderVictimAlert() {
    const groups = new Map();
    openVictimKeys = [];
    for (const rep of reports) {
      const updates = Array.isArray(rep.updates) ? rep.updates : [];
      updates.forEach((u, i) => {
        if (!u || chipKind(u) !== "victim") return;
        const key = reportKey(rep) + "#" + i;
        if (ackedVictims.has(key)) return;
        openVictimKeys.push(key);
        const place = victimPlace(u);
        groups.set(place, (groups.get(place) || 0) + victimCount(u));
      });
    }
    const banner = $("victimAlert");
    if (!openVictimKeys.length) {
      banner.hidden = true;
      $("victimText").textContent = "";
      return;
    }
    const places = [...groups.keys()].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    $("victimText").textContent = places.map((place) => victimSentence(groups.get(place), place)).join(". ");
    banner.hidden = false;
  }

  function itemId(item) {
    if (item == null) return "";
    if (typeof item !== "object") return String(item);
    if (item.id != null) return String(item.id);
    if (item.room_id != null) return String(item.room_id);
    return "";
  }

  function itemLevel(item) {
    if (item && typeof item === "object" && item.level != null && item.level !== "") return item.level;
    const id = itemId(item);
    const space = id && (roomById[id] || roomById[item && item.id]);
    return space ? space.level : null;
  }

  function itemLabel(item) {
    if (item == null) return "";
    if (typeof item !== "object") return roomName(item);
    if (item.label) return String(item.label);
    const id = itemId(item);
    return id ? roomName(id) : "";
  }

  function roomsOnFloor(fl) {
    return (fl.spaces || []).filter((s) => s && s.id != null && !SKIP_TYPES.has(s.type));
  }

  function applySearch(data) {
    searchedIds = new Set();
    unsearchedItems = [];
    searchListed = false;
    if (!data || typeof data !== "object" || Array.isArray(data)) return;
    const bag = data.searched && typeof data.searched === "object" && !Array.isArray(data.searched)
      ? data.searched : data;
    for (const [k, v] of Object.entries(bag)) {
      if (k === "unsearched" || k === "searched") continue;
      if (v && typeof v === "object") searchedIds.add(String(k));
    }
    if (Array.isArray(data.unsearched)) {
      searchListed = true;
      unsearchedItems = data.unsearched;
    }
  }

  function renderSearch() {
    const box = $("search");
    box.replaceChildren();
    if (!searchLive) {
      box.textContent = "Reports unavailable";
      return;
    }
    const floors = ((building && building.floors) || []).slice().sort((a, b) => num(a.level) - num(b.level));
    const used = new Set();
    let shown = 0;
    for (const fl of floors) {
      const spaces = roomsOnFloor(fl);
      if (!spaces.length) continue;
      const done = spaces.filter((s) => searchedIds.has(String(s.id))).length;
      let todo = [];
      if (searchListed) {
        unsearchedItems.forEach((item, i) => {
          const id = itemId(item);
          if (id && searchedIds.has(id)) return;
          if (Number(itemLevel(item)) !== Number(fl.level)) return;
          todo.push(item);
          used.add(i);
        });
      } else {
        todo = spaces.filter((s) => !searchedIds.has(String(s.id)));
      }
      shown += 1;
      const block = document.createElement("div");
      block.className = "floor-prog";
      const head = document.createElement("div");
      head.className = "rep-top";
      const name = document.createElement("b");
      name.textContent = "Floor " + fl.level;
      const count = document.createElement("span");
      count.className = "k";
      count.textContent = done + " / " + spaces.length;
      head.append(name, count);
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.setAttribute("role", "progressbar");
      bar.setAttribute("aria-valuemin", "0");
      bar.setAttribute("aria-valuemax", String(spaces.length));
      bar.setAttribute("aria-valuenow", String(done));
      bar.setAttribute("aria-label", "Floor " + fl.level + " searched");
      const fill = document.createElement("i");
      fill.style.width = (spaces.length ? Math.round((done / spaces.length) * 100) : 0) + "%";
      bar.appendChild(fill);
      const line = document.createElement("div");
      line.className = "todo";
      if (!todo.length) line.textContent = "All searched.";
      else {
        const labels = todo.map(itemLabel).filter(Boolean);
        labels.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        line.textContent = "Unsearched: " + labels.join(", ");
      }
      block.append(head, bar, line);
      box.appendChild(block);
    }
    if (searchListed) {
      const rest = [];
      unsearchedItems.forEach((item, i) => {
        if (used.has(i)) return;
        const id = itemId(item);
        if (id && searchedIds.has(id)) return;
        const label = itemLabel(item);
        if (label) rest.push(label);
      });
      if (rest.length) {
        const line = document.createElement("div");
        line.className = "todo";
        rest.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
        line.textContent = "Unsearched: " + rest.join(", ");
        box.appendChild(line);
        shown += 1;
      }
    }
    if (!shown) box.textContent = "No rooms to search.";
  }

  function setRadio(msg, isError) {
    const el = $("radioMsg");
    el.textContent = msg || "";
    el.className = isError ? "bad" : "k";
  }

  async function pollReportsOnce() {
    let repRes;
    let seaRes;
    try {
      [repRes, seaRes] = await Promise.all([
        fetch("/api/reports", { cache: "no-store" }),
        fetch("/api/reports/searched", { cache: "no-store" }),
      ]);
    } catch {
      reportsLive = false;
      searchLive = false;
      renderReports();
      renderSearch();
      renderVictimAlert();
      return;
    }
    if (repRes.status === 404 || repRes.status === 503 || !repRes.ok) {
      reportsLive = false;
    } else {
      const data = await readBody(repRes);
      reports = asReportList(data).filter((r) => r && typeof r === "object");
      reports.sort((a, b) => (timeMs(b.t) || 0) - (timeMs(a.t) || 0));
      reportsLive = true;
    }
    if (seaRes.status === 404 || seaRes.status === 503 || !seaRes.ok) {
      searchLive = false;
    } else {
      applySearch(await readBody(seaRes));
      searchLive = true;
    }
    renderReports();
    renderSearch();
    renderVictimAlert();
    renderFind();
  }

  function pollReports() {
    const job = reportTail.then(pollReportsOnce, pollReportsOnce);
    reportTail = job.then(() => {}, () => {});
    return job;
  }

  $("victimAck").addEventListener("click", () => {
    for (const key of openVictimKeys) ackedVictims.add(key);
    renderVictimAlert();
  });

  $("radioForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const text = $("radioText").value.trim();
    if (!text) return;
    const btn = ev.currentTarget.querySelector("button");

    try {

      setRadio(typeof conf === "string" && conf ? conf : "Report sent.");
      $("radioText").value = "";
      await pollReports();

      setRadio("Reports unavailable", true);

    }
  });

  function namedRooms() {
    const out = [];
    for (const s of Object.values(roomById)) {
      const type = String(s.type || "").toLowerCase();
      if (type === "unknown" || type === "void" || type === "unlabeled") continue;
      const label = String(s.label || "").trim();
      if (!label) continue;
      out.push(s);
    }
    out.sort((a, b) => {
      const dl = num(a.level) - num(b.level);
      if (dl) return dl;
      return String(a.label).localeCompare(String(b.label), undefined, { numeric: true });
    });
    return out;
  }

  function roomNum(s) {
    const label = String((s && (s.label || s.id)) || "");
    const m = label.match(/\d+/);
    return m ? m[0] : label;
  }

  function roomStatus(id) {
    const st = (state.rooms || {})[id];
    return st === "fire" || st === "smoke" ? st : "clear";
  }

  function peopleIn(id) {
    return people.filter((p) => p && String(p.room_id) === String(id));
  }

  function matchRoom(s, q) {
    const query = q.trim().toLowerCase();
    if (!query) return false;
    const label = String(s.label || "").toLowerCase();
    const id = String(s.id || "").toLowerCase();
    if (label.includes(query) || id.includes(query)) return true;
    const digits = query.replace(/\D/g, "");
    if (!digits) return false;
    return label.includes(digits) || id.includes(digits) || roomNum(s) === digits;
  }

  function focusRoom(id) {
    const frame = $("buildFrame");
    if (!frame || !frame.contentWindow) return;
    frame.contentWindow.postMessage({ type: "focusRoom", id: id }, "*");
  }

  function pickFound(s) {
    findPick = s.id;
    selectedId = s.id;
    const sel = $("roomSel");
    if ([...sel.options].some((o) => o.value === s.id)) sel.value = s.id;
    focusRoom(s.id);
    renderFind();
  }

  function findBtn(label, fn) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();
      fn();
    });
    return b;
  }

  async function reportFound(s, text) {
    try {
      const { res, data } = await postJSON("/api/reports", { text: text, by: "Command" });
      if (!res.ok) { setCtrl(detailOf(data, "Could not send the report."), true); return; }
      const conf = data && data.confirmation;
      setCtrl(typeof conf === "string" && conf ? conf : "Report sent.");
      await pollReports();
    } catch {
      setCtrl("Reports unavailable", true);
    }
  }

  async function simFound(s) {
    try {
      const { res, data } = await postJSON("/api/fire/start", { room_id: s.id });
      if (!res.ok) { setCtrl(detailOf(data, "Could not start the fire."), true); return; }
      setCtrl("Fire started in " + (s.label || s.id) + ".");
      await pollLive();
      await loadBrief();
    } catch {
      setCtrl("Could not start the fire.", true);
    }
  }

  function renderFind() {
    const box = $("findBox");
    const input = $("roomFind");
    if (!box || !input) return;
    const q = input.value;
    box.replaceChildren();
    if (!q.trim() || !building) { box.hidden = true; return; }
    const hits = namedRooms().filter((s) => matchRoom(s, q)).slice(0, 20);
    box.hidden = false;
    if (!hits.length) {
      const empty = document.createElement("p");
      empty.className = "k find-empty";
      empty.textContent = "No rooms match.";
      box.appendChild(empty);
      return;
    }
    for (const s of hits) {
      const row = document.createElement("div");
      row.className = "find-hit" + (s.id === findPick ? " on" : "");
      const title = document.createElement("div");
      title.textContent = s.label;
      const meta = document.createElement("div");
      meta.className = "find-meta";
      const who = peopleIn(s.id);
      const names = who.map((p) => p.person_id || "person").join(", ");
      const searched = searchedIds.has(String(s.id)) ? "searched" : "not searched";
      meta.textContent = "Floor " + s.level + " · " + roomStatus(s.id) + " · " + searched + " · " +
        (who.length ? who.length + " " + (who.length === 1 ? "person" : "people") + " (" + names + ")" : "no people");
      row.append(title, meta);
      row.addEventListener("click", () => pickFound(s));
      box.appendChild(row);
      if (s.id !== findPick) continue;
      const act = document.createElement("div");
      act.className = "find-act";
      const num = roomNum(s);
      act.append(
        findBtn("Mark searched", () => reportFound(s, "Room " + num + " searched")),
        findBtn("Report fire", () => reportFound(s, "Fire in room " + num)),
        findBtn("Start sim fire", () => simFound(s)),
      );
      box.appendChild(act);
    }
  }

  async function setFireMode(mode) {
    try {
      const { res, data } = await postJSON("/api/fire/mode", { mode: mode });
      if (!res.ok) { setCtrl(detailOf(data, "Could not set the mode."), true); return; }
      state.mode = data.mode || mode;
      applyChrome();
      await pollLive();
    } catch {
      setCtrl("Could not set the mode.", true);
    }
  }

  $("roomFind").addEventListener("input", renderFind);
  $("roomFind").addEventListener("focus", renderFind);
  $("modeSim").addEventListener("click", () => setFireMode("simulate"));
  $("modeRep").addEventListener("click", () => setFireMode("reports"));

  const PANEL_KEY = "fs-cmd-panels";
  const BUILD_KEY = "fs-cmd-build-vh";

  function readStore(key) {
    try { return localStorage.getItem(key); }
    catch { return null; }
  }

  function writeStore(key, value) {
    try { localStorage.setItem(key, value); }
    catch { /* storage off */ }
  }

  function clampVh(n) {
    return Math.min(85, Math.max(30, n));
  }

  function applyBuildVh(vh) {
    document.documentElement.style.setProperty("--build-h", clampVh(vh) + "vh");
  }

  function savePanels() {
    const saved = {};
    document.querySelectorAll("section[data-panel]").forEach((sec) => {
      saved[sec.dataset.panel] = sec.classList.contains("collapsed");
    });
    writeStore(PANEL_KEY, JSON.stringify(saved));
  }

  function setPanel(sec, collapsed) {
    sec.classList.toggle("collapsed", collapsed);
    const btn = sec.querySelector(".chev");
    if (btn) btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
  }

  function setupPanels() {
    const stored = parseFloat(readStore(BUILD_KEY));
    applyBuildVh(Number.isFinite(stored) ? stored : 55);
    let saved = {};
    try { saved = JSON.parse(readStore(PANEL_KEY) || "{}") || {}; }
    catch { saved = {}; }
    document.querySelectorAll("section[data-panel]").forEach((sec) => {
      setPanel(sec, saved[sec.dataset.panel] === true);
      const btn = sec.querySelector(".chev");
      if (!btn) return;
      btn.addEventListener("click", () => {
        setPanel(sec, !sec.classList.contains("collapsed"));
        savePanels();
      });
    });
    $("collapseAll").addEventListener("click", () => {
      document.querySelectorAll("section[data-panel]").forEach((sec) => setPanel(sec, true));
      savePanels();
    });
    $("expandAll").addEventListener("click", () => {
      document.querySelectorAll("section[data-panel]").forEach((sec) => setPanel(sec, false));
      savePanels();
    });
    const handle = $("buildResize");
    const sec = $("buildSec");
    handle.addEventListener("pointerdown", (ev) => {
      if (sec.classList.contains("collapsed")) return;
      ev.preventDefault();
      handle.setPointerCapture(ev.pointerId);
      handle.classList.add("drag");
      sec.classList.add("resizing");
      const startY = ev.clientY;
      const startH = sec.getBoundingClientRect().height;
      const move = (e) => {
        const next = clampVh(((startH + (e.clientY - startY)) / window.innerHeight) * 100);
        applyBuildVh(next);
        handle.dataset.vh = String(next);
      };
      const up = () => {
        handle.classList.remove("drag");
        sec.classList.remove("resizing");
        handle.removeEventListener("pointermove", move);
        handle.removeEventListener("pointerup", up);
        handle.removeEventListener("pointercancel", up);
        const next = parseFloat(handle.dataset.vh);
        writeStore(BUILD_KEY, String(Math.round((Number.isFinite(next) ? next : 55) * 10) / 10));
      };
      handle.addEventListener("pointermove", move);
      handle.addEventListener("pointerup", up);
      handle.addEventListener("pointercancel", up);
    });
  }

  setupPanels();

  async function boot() {
    try {
      const res = await fetch("/api/building", { cache: "no-store" });
      const data = await readBody(res);
      if (!res.ok) throw new Error(detailOf(data, "Could not load the building."));
      building = data;
    } catch (err) {
      $("bname").textContent = err.message || "Could not load the building.";
      showTimelineMessage("History unavailable.");
      pollReports();
      armPolls();
      connectLive();
      return;
    }
    $("bname").textContent = building.building || "Building";
    indexRooms();
    fillRooms();
    renderPeople();
    await pollLive();
    loadBrief();
    pollTimeline();
    pollReports();
    armPolls();
    connectLive();
    setInterval(() => { if (fireRunning) loadBrief(); }, 10000);
  }

  boot();
})();
</script>
<script src="nav.js" defer></script>
