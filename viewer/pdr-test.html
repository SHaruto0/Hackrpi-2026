<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121417">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PDR test</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #121417;
    --card: #1c2026;
    --line: #2e343c;
    --text: #f3f4f6;
    --muted: #9aa3ad;
    --accent: #e86a2a;
    --ink: #1a0e08;
    --ok: #37d67a;
    --warn: #f0b429;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    padding: max(16px, env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
  }
  main { max-width: 520px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; font-weight: 650; color: var(--muted); margin: 16px 0 8px; }
  p { margin: 0; }
  .sub, .hint { color: var(--muted); font-size: 14px; }
  .hint { margin-top: 12px; }
  .actions { display: grid; gap: 8px; margin-top: 16px; }
  button, input, label { font: inherit; }
  button {
    appearance: none;
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: 12px;
    background: var(--accent);
    color: var(--ink);
    font-weight: 700;
    padding: 14px 16px;
    touch-action: manipulation;
  }
  button.ghost {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
  }
  button:active { transform: scale(0.99); }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  input[type="text"], input[type="number"], input[type="url"] {
    width: 100%;
    min-height: 48px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    padding: 12px;
  }
  .coords {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .coords label, .base, .sim label.grow {
    display: grid;
    gap: 4px;
    color: var(--muted);
    font-size: 13px;
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .note { color: var(--muted); font-size: 13px; }
  video {
    width: 100%;
    max-height: 200px;
    background: #000;
    border-radius: 12px;
    object-fit: cover;
  }
  video[hidden] { display: none; }
  .sim {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .sim .check {
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 44px;
    font-weight: 700;
    color: var(--text);
  }
  .sim input[type="checkbox"] { width: 22px; height: 22px; }
  .sim label.grow { flex: 1; }
  input[type="range"] { width: 100%; }
  #hdgNum { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
  .readout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 16px;
  }
  .readout div {
    background: var(--card);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .k { display: block; color: var(--muted); font-size: 12px; }
  .v { font-size: 20px; font-variant-numeric: tabular-nums; }
  .v.ok { color: var(--ok); }
  .v.bad { color: var(--warn); }
  #seen {
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    min-height: 48px;
  }
  #seen div { padding: 4px 0; font-variant-numeric: tabular-nums; }
  #status {
    min-height: 1.4em;
    margin-top: 12px;
    color: var(--text);
  }
  #trace {
    width: 100%;
    height: 200px;
    display: block;
    border-radius: 12px;
    background: var(--card);
  }
</style>
</head>
<body>
<main>
  <h1>PDR test</h1>
  <p class="sub">Steps, compass, and room numbers from the camera.</p>
  <p class="hint" id="secure"></p>

  <div class="actions">
    <button type="button" id="perm">Enable sensors</button>
    <button type="button" id="walk">Walk test</button>
    <input id="room" type="text" placeholder="Room id" aria-label="Room id" autocapitalize="characters" autocomplete="off" spellcheck="false">
    <button type="button" id="start">Start at room</button>
    <div class="coords">
      <label>Level <input id="lv" type="number" value="1" step="1" inputmode="numeric"></label>
      <label>X <input id="px" type="number" value="0" step="0.1" inputmode="decimal"></label>
      <label>Y <input id="py" type="number" value="0" step="0.1" inputmode="decimal"></label>
    </div>
    <p class="note">Level, x, and y are sent with the room.</p>
    <div class="pair">
      <button type="button" id="up" class="ghost">Took stairs up</button>
      <button type="button" id="down" class="ghost">Took stairs down</button>
    </div>
    <button type="button" id="cam" class="ghost">Camera on</button>
    <video id="vid" playsinline webkit-playsinline muted autoplay hidden></video>
    <div class="sim">
      <label class="check"><input id="sim" type="checkbox"> Simulate</label>
      <label class="grow">Heading
        <input id="hdg" type="range" min="0" max="359" value="0">
      </label>
      <span id="hdgNum">0°</span>
    </div>
    <label class="base">API base
      <input id="base" type="url" placeholder="same origin" autocomplete="off" inputmode="url">
    </label>
  </div>

  <section class="readout" aria-live="polite">
    <div><span class="k">Steps</span><span class="v" id="steps">0</span></div>
    <div><span class="k">Heading</span><span class="v" id="heading">-</span></div>
    <div><span class="k">Last step</span><span class="v" id="len">-</span></div>
    <div><span class="k">Level</span><span class="v" id="level">-</span></div>
    <div><span class="k">X</span><span class="v" id="x">-</span></div>
    <div><span class="k">Y</span><span class="v" id="y">-</span></div>
    <div><span class="k">Spread</span><span class="v" id="spread">-</span></div>
    <div><span class="k">Confidence</span><span class="v" id="conf">-</span></div>
    <div><span class="k">Unsure</span><span class="v" id="unsure">-</span></div>
    <div><span class="k">Source</span><span class="v" id="source">-</span></div>
  </section>

  <h2>Seen</h2>
  <div id="seen">No frames yet</div>
  <p id="status" role="status"></p>
  <canvas id="trace" width="640" height="400" aria-label="Pose trace"></canvas>
  <p class="hint">Pose trace. Session <span id="sid"></span>. Open this page from the Firesight server over HTTPS.</p>
</main>

<script src="pdr.js"></script>
<script>
(function () {
  "use strict";

  var session = "pdr-" + Math.random().toString(36).slice(2, 8);
  var stepCount = 0;
  var walking = false;
  var camOn = false;
  var simTimer = null;
  var pts = [];
  var lastLevel = null;

  var el = function (id) { return document.getElementById(id); };
  el("sid").textContent = session;

  if (!window.isSecureContext) {
    el("secure").textContent = "Use HTTPS so the phone can read motion and the camera.";
  }

  function setStatus(text) {
    el("status").textContent = text || "";
  }

  function numOr(id, fallback) {
    var raw = el(id).value;
    if (String(raw).trim() === "") return fallback;
    var n = Number(raw);
    return isFinite(n) ? n : fallback;
  }

  function sync() {
    FiresightPDR.init({
      session: session,
      apiBase: el("base").value.trim(),
      onPose: showPose,
      onStep: onRealStep,
      onStatus: setStatus
    });
  }

  function onRealStep(step) {
    stepCount += 1;
    el("steps").textContent = String(stepCount);
    el("len").textContent = Number(step.length_m).toFixed(2) + " m";
  }

  function renderSeen(seen) {
    var box = el("seen");
    box.textContent = "";
    if (!seen || !seen.length) {
      box.textContent = "Nothing read";
      return;
    }
    seen.forEach(function (item) {
      var row = document.createElement("div");
      var score = Number(item.score);
      row.textContent = (item.text || "") + "  " + (item.room_id || "") + "  " +
        (isFinite(score) ? score.toFixed(2) : "-");
      box.appendChild(row);
    });
  }

  function pushTrace(pose) {
    if (lastLevel !== null && pose.level !== lastLevel) pts.push(null);
    lastLevel = pose.level;
    pts.push({ x: pose.x, y: pose.y });
    if (pts.length > 500) pts.splice(0, pts.length - 500);
    drawTrace();
  }

  function showPose(pose) {
    if (!pose || typeof pose !== "object") return;
    if (typeof pose.level === "number") el("level").textContent = String(pose.level);
    if (typeof pose.x === "number") el("x").textContent = pose.x.toFixed(2);
    if (typeof pose.y === "number") el("y").textContent = pose.y.toFixed(2);
    if (typeof pose.spread_m === "number") el("spread").textContent = pose.spread_m.toFixed(2) + " m";
    if (typeof pose.confidence === "number") el("conf").textContent = pose.confidence.toFixed(2);
    if (typeof pose.unsure === "boolean") {
      el("unsure").textContent = pose.unsure ? "yes" : "no";
      el("unsure").className = "v " + (pose.unsure ? "bad" : "ok");
    }
    if (pose.source) el("source").textContent = String(pose.source);
    if (pose.seen) renderSeen(pose.seen);
    if (typeof pose.x === "number" && typeof pose.y === "number") pushTrace(pose);
  }

  function drawTrace() {
    var c = el("trace");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssW = c.clientWidth || 320;
    var cssH = c.clientHeight || 200;
    c.width = Math.round(cssW * dpr);
    c.height = Math.round(cssH * dpr);
    var g = c.getContext("2d");
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, cssW, cssH);
    g.fillStyle = "#1c2026";
    g.fillRect(0, 0, cssW, cssH);

    var real = pts.filter(function (p) { return p; });
    if (!real.length) {
      g.fillStyle = "#9aa3ad";
      g.font = "14px system-ui, sans-serif";
      g.fillText("Pose trace", 14, 28);
      return;
    }

    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    real.forEach(function (p) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    });
    var span = Math.max(maxX - minX, maxY - minY, 2);
    var pad = 16;
    function X(x) { return pad + ((x - minX) / span) * (cssW - pad * 2); }
    function Y(y) { return pad + ((y - minY) / span) * (cssH - pad * 2); }

    g.strokeStyle = "#e86a2a";
    g.lineWidth = 2;
    g.lineJoin = "round";
    g.lineCap = "round";
    g.beginPath();
    var drawing = false;
    pts.forEach(function (p) {
      if (!p) { drawing = false; return; }
      var x = X(p.x);
      var y = Y(p.y);
      if (!drawing) { g.moveTo(x, y); drawing = true; }
      else g.lineTo(x, y);
    });
    g.stroke();

    var last = real[real.length - 1];
    g.fillStyle = "#37d67a";
    g.beginPath();
    g.arc(X(last.x), Y(last.y), 5, 0, Math.PI * 2);
    g.fill();
  }

  function showHeading() {
    if (el("sim").checked) {
      el("heading").textContent = el("hdg").value + "°";
      return;
    }
    var h = FiresightPDR.heading();
    el("heading").textContent = h == null ? "-" : Math.round(h) + "°";
  }

  function apiBase() {
    return el("base").value.trim().replace(/\/$/, "");
  }

  async function postSim() {
    var step = {
      t: Date.now(),
      heading_deg: Number(el("hdg").value),
      length_m: 0.7
    };
    stepCount += 1;
    el("steps").textContent = String(stepCount);
    el("len").textContent = "0.70 m";
    try {
      var res = await fetch(apiBase() + "/api/loc/steps", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session: session, steps: [step] })
      });
      if (!res.ok) throw new Error(String(res.status));
      showPose(await res.json());
    } catch (err) {
      setStatus("Simulate failed (" + err.message + ")");
    }
  }

  el("perm").addEventListener("click", function () {
    sync();
    FiresightPDR.requestPermissions();
  });

  el("walk").addEventListener("click", function () {
    sync();
    if (!walking) {
      FiresightPDR.start();
      walking = true;
      el("walk").textContent = "Stop walk";
    } else {
      FiresightPDR.stop();
      walking = false;
      el("walk").textContent = "Walk test";
    }
  });

  el("start").addEventListener("click", function () {
    sync();
    var room = el("room").value.trim();
    var opts = { level: numOr("lv", 1), x: numOr("px", 0), y: numOr("py", 0) };
    if (room) opts.room_id = room;
    FiresightPDR.startAt(opts);
  });

  el("up").addEventListener("click", function () {
    sync();
    FiresightPDR.tookStairs("up");
  });

  el("down").addEventListener("click", function () {
    sync();
    FiresightPDR.tookStairs("down");
  });

  el("cam").addEventListener("click", async function () {
    sync();
    if (!camOn) {
      el("vid").hidden = false;
      var ok = await FiresightPDR.enableCamera(el("vid"), 2500);
      if (!ok) {
        el("vid").hidden = true;
        return;
      }
      camOn = true;
      el("cam").textContent = "Camera off";
    } else {
      FiresightPDR.disableCamera();
      camOn = false;
      el("cam").textContent = "Camera on";
      el("vid").hidden = true;
    }
  });

  el("hdg").addEventListener("input", function () {
    el("hdgNum").textContent = el("hdg").value + "°";
    if (el("sim").checked) el("heading").textContent = el("hdg").value + "°";
  });

  el("sim").addEventListener("change", function () {
    if (simTimer) {
      clearInterval(simTimer);
      simTimer = null;
    }
    if (el("sim").checked) {
      setStatus("Simulating steps");
      simTimer = setInterval(postSim, 600);
      showHeading();
    }
  });

  el("base").addEventListener("change", sync);

  setInterval(showHeading, 200);
  window.addEventListener("resize", drawTrace);
  window.addEventListener("pagehide", function () {
    if (simTimer) clearInterval(simTimer);
    FiresightPDR.disableCamera();
    FiresightPDR.stop();
  });

  sync();
  drawTrace();
})();
</script>
</body>
</html>
