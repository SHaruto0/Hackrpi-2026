<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firesight editor</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --text:#e6edf3; --muted:#8b949e;
          --fire:#ff4d3d; --smoke:#d9a441; --safe:#3fb950; --route:#58a6ff; --accent:#1f6feb; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
               font:13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; overflow:hidden; }
  button, input, select, textarea { font:inherit; color:var(--text); background:#21262d;
               border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  button { cursor:pointer; } button:hover { border-color:#8b949e; }
  button.primary { background:var(--accent); border-color:var(--accent); }
  button.warn { background:#da3633; border-color:#da3633; }
  button.on { background:var(--accent); border-color:var(--accent); }
  button:disabled { opacity:.45; cursor:default; }
  textarea { width:100%; min-height:52px; resize:vertical; }
  a { color:var(--route); }
  #app { display:grid; grid-template-rows:auto 1fr auto; height:100%; }
  header { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:8px 10px;
           background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; }
  .sub { color:var(--muted); font-size:12px; }
  .brand { margin-right:4px; }
  .inline { display:flex; gap:6px; align-items:center; color:var(--muted); }
  .grow { flex:1; }
  #search { width:180px; }
  #saveName { width:120px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#6e7681; display:inline-block; }
  .dot.on { background:var(--safe); }
  #saveLabel { color:var(--muted); min-width:52px; }
  #mid { display:grid; grid-template-columns:200px 1fr 300px; min-height:0; }
  #tools, #inspector { overflow:auto; background:var(--panel); padding:10px; min-height:0; }
  #tools { border-right:1px solid var(--line); }
  #inspector { border-left:1px solid var(--line); }
  #stage { position:relative; min-width:0; min-height:0; }
  canvas { width:100%; height:100%; display:block; touch-action:none; background:var(--bg); }
  #zoombar { position:absolute; right:10px; bottom:10px; display:flex; gap:6px; }
  #status { display:flex; justify-content:space-between; gap:12px; padding:4px 10px;
            background:var(--panel); border-top:1px solid var(--line); color:var(--muted); }
  #statHint { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right; }
  .tool { display:flex; width:100%; justify-content:space-between; margin:0 0 4px; }
  .field { display:flex; flex-direction:column; gap:2px; margin:6px 0; }
  .field > span, .check, .muted, .hint { color:var(--muted); }
  .check { display:flex; gap:6px; align-items:center; margin:4px 0; }
  .row2 { display:flex; gap:6px; }
  .row2 .field { flex:1; min-width:0; }
  .hint { font-size:12px; margin:8px 0 0; }
  h2 { font-size:13px; margin:10px 0 4px; }
  .actions { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  #issueBox { max-height:34vh; overflow:auto; margin-top:4px; }
  button.issue { display:block; width:100%; text-align:left; background:transparent; border:0;
                 color:var(--smoke); padding:3px 0; border-radius:0; }
  button.issue:hover { color:var(--text); }
  .issue.static { color:var(--smoke); padding:3px 0; }
  #toast { position:fixed; left:50%; bottom:36px; transform:translateX(-50%); max-width:min(640px, 86vw);
           background:#21262d; border:1px solid var(--line); border-radius:8px; padding:8px 12px; z-index:5; }
  kbd { font:11px ui-monospace, Consolas, monospace; color:var(--muted); border:1px solid var(--line);
        border-radius:4px; padding:0 4px; }
  @media (max-width: 980px) { #mid { grid-template-columns:168px 1fr 240px; } #search { width:120px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>Firesight</h1><div class="sub" id="bname">Map editor</div></div>
    <label class="inline">Floor <select id="floorSel"></select></label>
    <button type="button" id="btnUndo" title="Ctrl+Z">Undo</button>
    <button type="button" id="btnRedo" title="Ctrl+Y">Redo</button>
    <button type="button" id="btnFit" class="primary" title="Fit floor (F)">Fit to view</button>
    <input id="search" type="search" placeholder="Find room, door, id" autocomplete="off" spellcheck="false">
    <span class="dot" id="serverDot" title="API server"></span>
    <span id="saveLabel">saved</span>
    <span class="grow"></span>
    <button type="button" id="btnNew">New</button>
    <button type="button" id="btnOpen">Open</button>
    <button type="button" id="btnReload">Reload</button>
    <button type="button" id="btnDownload">Download</button>
    <input id="saveName" type="text" spellcheck="false" placeholder="file-name" title="Saved as data/name.json">
    <button type="button" id="btnSave">Save file</button>
    <button type="button" id="btnPush" class="primary">Send to viewer</button>
    <a href="index.html">3D viewer</a>
  </header>
  <div id="mid">
    <aside id="tools">
      <button type="button" class="tool on" data-tool="select">Select <kbd>V</kbd></button>
      <button type="button" class="tool" data-tool="pan">Pan <kbd>H</kbd></button>
      <button type="button" class="tool" data-tool="wall">Wall <kbd>W</kbd></button>
      <button type="button" class="tool" data-tool="room">Room <kbd>R</kbd></button>
      <button type="button" class="tool" data-tool="door">Door <kbd>D</kbd></button>
      <button type="button" class="tool" data-tool="exit">Exit <kbd>X</kbd></button>
      <button type="button" class="tool" data-tool="vertical">Stairs <kbd>T</kbd></button>
      <button type="button" class="tool" data-tool="outline">Outline <kbd>O</kbd></button>
      <button type="button" class="tool" data-tool="scale">Scale <kbd>K</kbd></button>
      <label class="field"><span>Grid snap (m)</span>
        <select id="snap">
          <option value="0">Off</option>
          <option value="0.1">0.1</option>
          <option value="0.25" selected>0.25</option>
          <option value="0.5">0.5</option>
          <option value="1">1</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="optCorners" checked> Snap to corners</label>
      <label class="check"><input type="checkbox" id="optLabels" checked> Room labels</label>
      <label class="check"><input type="checkbox" id="optGhost" checked> Ghost other floors</label>
      <label class="check"><input type="checkbox" id="optLow" checked> Low confidence</label>
      <label class="check"><input type="checkbox" id="optExterior"> New walls are exterior</label>
      <label class="check"><input type="checkbox" id="optExit"> New doors are exits</label>
      <label class="check"><input type="checkbox" id="optIssueFloor" checked> Issues on this floor</label>
      <label class="field"><span>New room type</span><select id="roomType"></select></label>
      <label class="field"><span>New door width (m)</span>
        <input id="doorWidth" type="number" step="0.05" min="0.05" value="0.9">
      </label>
      <label class="field"><span>Known length (m)</span>
        <input id="knownM" type="number" step="0.01" min="0.05" value="0.9">
      </label>
      <label class="field"><span>Scale applies to</span>
        <select id="scaleScope">
          <option value="all">All floors</option>
          <option value="floor">This floor</option>
        </select>
      </label>
      <div class="actions">
        <button type="button" id="btnCheck">Check viewer</button>
      </div>
      <p class="hint">Meters, x right, y down. Right-drag pans. Scroll zooms. A single door is 0.9 m. Shift keeps a wall horizontal or vertical.</p>
    </aside>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="zoombar">
        <button type="button" id="btnZoomOut" title="Zoom out">-</button>
        <button type="button" id="btnZoomIn" title="Zoom in">+</button>
      </div>
    </div>
    <aside id="inspector"></aside>
  </div>
  <div id="status"><span id="statLeft"></span><span id="statHint"></span></div>
</div>
<div id="toast" hidden></div>
<pre id="selftest" hidden>PENDING</pre>
<input id="file" type="file" accept="application/json,.json" hidden>
<script>
const SPACE_TYPES = ["classroom","office","hallway","lobby","restroom","stairwell","elevator","mechanical","lecture_hall","storage","unknown","void"];
const VERT_TYPES = ["stairs","elevator","ramp"];
const OPEN_TYPES = new Set(["hallway","lobby"]);
const SPACE_COLORS = {
  classroom:"#3d4f66", office:"#3a4554", hallway:"#2c3542", lobby:"#33404c", restroom:"#3d3a52",
  stairwell:"#1e4d32", elevator:"#3a3a46", mechanical:"#4a3b2a", lecture_hall:"#2e4560",
  storage:"#3e3a34", unknown:"#3a3038", void:"#14181e",
};
const GHOST = ["#8b949e","#d9a441","#bc8cff","#3fb950","#ff7b72"];
const HINTS = {
  select: "Click to select. Drag a point to reshape, or drag the shape to move.",
  pan: "Drag to pan. Scroll to zoom.",
  wall: "Click the start, then the end. Shift keeps the wall straight. Esc ends the chain.",
  room: "Click each corner. Enter, or a click on the first corner, closes the room.",
  door: "Click a wall. The door snaps to it and links the spaces on each side.",
  exit: "Click a wall or the outline to place an exit. Click an existing door to toggle it.",
  vertical: "Click the stair, elevator, or ramp. Drag moves this floor. Alt-drag moves every floor.",
  outline: "Click the footprint corners. Enter closes the outline.",
  scale: "Click two points that are really the known length apart. Click a door, then Enter, to scale from its width.",
};

const $ = (id) => document.getElementById(id);
const canvas = $("cv");
const ctx = canvas.getContext("2d");

let doc = null;
let floorLevel = 1;
let tool = "select";
let sel = null;
let draft = null;
let hover = null;
let drag = null;
let history = [];
let future = [];
let pendingBefore = null;
let saveState = "saved";
let serverOn = false;
let busy = false;
let serverIssues = [];
let localIssues = [];
let shiftDown = false;
let spaceDown = false;
let mouse = [0, 0];
let mouseOn = false;
let searchQ = "";
let searchHits = [];
let searchAt = 0;
const view = { zoom: 8, panX: 40, panY: 40, dpr: 1 };

function toast(msg) {
  const el = $("toast");
  el.hidden = false;
  el.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 4200);
}

function h(tag, props, kids) {
  const n = document.createElement(tag);
  if (props) {
    for (const [k, v] of Object.entries(props)) {
      if (v == null) continue;
      if (k === "class") n.className = v;
      else if (k === "text") n.textContent = String(v);
      else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
      else n[k] = v;
    }
  }
  if (kids) for (const c of kids) if (c != null) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}

function current() {
  return doc.floors.find((f) => f.level === floorLevel) || doc.floors[0];
}
function byId(list, id) { return list.find((x) => x.id === id); }
function r3(n) { return Math.round((+n) * 1000) / 1000; }
function r4(n) { return Math.round((+n) * 10000) / 10000; }
function num(v, d = 0) { const n = +v; return Number.isFinite(n) ? n : d; }

function asPoint(p) {
  if (Array.isArray(p) && p.length >= 2 && Number.isFinite(+p[0]) && Number.isFinite(+p[1])) return [+p[0], +p[1]];
  if (p && Number.isFinite(+p.x) && Number.isFinite(+p.y)) return [+p.x, +p.y];
  return null;
}
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function distToSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
  if (L2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}
function project(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L2 = dx * dx + dy * dy;
  if (L2 === 0) return { x: x1, y: y1, d: Math.hypot(px - x1, py - y1), t: 0 };
  let t = ((px - x1) * dx + (py - y1) * dy) / L2;
  t = Math.max(0, Math.min(1, t));
  const x = x1 + t * dx, y = y1 + t * dy;
  return { x, y, d: Math.hypot(px - x, py - y), t };
}
function unitOf(x1, y1, x2, y2) {
  const L = Math.hypot(x2 - x1, y2 - y1) || 1;
  return [(x2 - x1) / L, (y2 - y1) / L];
}
function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    const denom = yj !== yi ? (yj - yi) : 1e-12;
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / denom + xi)) inside = !inside;
  }
  return inside;
}
function centroid(poly) {
  if (!poly || !poly.length) return [0, 0];
  let x = 0, y = 0;
  for (const p of poly) { x += p[0]; y += p[1]; }
  return [x / poly.length, y / poly.length];
}
function transform(x, y, al) {
  const a = num(al.rotation_deg) * Math.PI / 180;
  const c = Math.cos(a), s = Math.sin(a);
  return [x * c - y * s + num(al.offset_x), x * s + y * c + num(al.offset_y)];
}
function rotateAxis(ax, ay, rotDeg) {
  const a = rotDeg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const x = ax * c - ay * s, y = ax * s + ay * c;
  const n = Math.hypot(x, y) || 1;
  return [x / n, y / n];
}

function blankBuilding() {
  const outline = [[0, 0], [30, 0], [30, 18], [0, 18]];
  return {
    building: "Untitled building", units: "meters",
    scale_method: "editor, a door is 0.9 m", floor_height_m: 4, wall_style: "centerline",
    floors: [{
      level: 1, alignment: { offset_x: 0, offset_y: 0, rotation_deg: 0 }, outline,
      walls: [
        { id: "F1-W1", x1: 0, y1: 0, x2: 30, y2: 0, exterior: true, confidence: 1 },
        { id: "F1-W2", x1: 30, y1: 0, x2: 30, y2: 18, exterior: true, confidence: 1 },
        { id: "F1-W3", x1: 30, y1: 18, x2: 0, y2: 18, exterior: true, confidence: 1 },
        { id: "F1-W4", x1: 0, y1: 18, x2: 0, y2: 0, exterior: true, confidence: 1 },
      ],
      spaces: [], doors: [], notes: "",
    }],
    vertical_connections: [], multi_floor_spaces: [], global_notes: "",
  };
}

function sanitize(data) {
  if (!data || typeof data !== "object" || !Array.isArray(data.floors) || !data.floors.length) {
    throw new Error("JSON needs a non-empty floors list");
  }
  data.building = String(data.building || "Building");
  data.units = "meters";
  data.scale_method = String(data.scale_method || "");
  data.floor_height_m = num(data.floor_height_m, 4) || 4;
  data.wall_style = data.wall_style === "faces" ? "faces" : "centerline";
  data.global_notes = String(data.global_notes || "");
  data.vertical_connections = Array.isArray(data.vertical_connections) ? data.vertical_connections : [];
  data.multi_floor_spaces = Array.isArray(data.multi_floor_spaces) ? data.multi_floor_spaces : [];
  data.floors = data.floors.filter((f) => f && typeof f === "object");
  data.floors.forEach((fl, i) => {
    fl.level = Number.isInteger(+fl.level) ? +fl.level : i + 1;
    const al = fl.alignment || {};
    fl.alignment = { offset_x: num(al.offset_x), offset_y: num(al.offset_y), rotation_deg: num(al.rotation_deg) };
    fl.outline = (fl.outline || []).map(asPoint).filter(Boolean);
    fl.notes = String(fl.notes || "");
    fl.walls = (fl.walls || []).filter((w) => w && ["x1", "y1", "x2", "y2"].every((k) => Number.isFinite(+w[k]))).map((w) => {
      w.x1 = +w.x1; w.y1 = +w.y1; w.x2 = +w.x2; w.y2 = +w.y2;
      w.id = w.id == null || w.id === "" ? `F${fl.level}-W` : String(w.id);
      w.exterior = !!w.exterior;
      w.confidence = Number.isFinite(+w.confidence) ? +w.confidence : 1;
      return w;
    });
    fl.spaces = (fl.spaces || []).filter((s) => s && typeof s === "object").map((s) => {
      s.polygon = (s.polygon || []).map(asPoint).filter(Boolean);
      s.id = s.id == null || s.id === "" ? `F${fl.level}-S` : String(s.id);
      s.label = String(s.label || s.id);
      s.type = String(s.type || "unknown");
      s.multi_floor = !!s.multi_floor;
      s.confidence = Number.isFinite(+s.confidence) ? +s.confidence : 1;
      return s;
    });
    fl.doors = (fl.doors || []).filter((d) => d && Number.isFinite(+d.x) && Number.isFinite(+d.y)).map((d) => {
      d.x = +d.x; d.y = +d.y;
      d.width = Number.isFinite(+d.width) ? +d.width : 0.9;
      d.id = d.id == null || d.id === "" ? `F${fl.level}-D` : String(d.id);
      d.connects = (d.connects || []).map(String);
      d.exterior_exit = !!d.exterior_exit;
      d.confidence = Number.isFinite(+d.confidence) ? +d.confidence : 1;
      if (Array.isArray(d.axis) && d.axis.length >= 2 && Number.isFinite(+d.axis[0]) && Number.isFinite(+d.axis[1])) {
        const L = Math.hypot(+d.axis[0], +d.axis[1]);
        d.axis = L > 1e-6 ? [+d.axis[0] / L, +d.axis[1] / L] : null;
      } else d.axis = null;
      return d;
    });
  });
  data.floors.sort((a, b) => a.level - b.level);
  data.vertical_connections = data.vertical_connections.filter((v) => v && typeof v === "object").map((v, i) => {
    v.id = v.id == null || v.id === "" ? `V${i + 1}` : String(v.id);
    v.name = String(v.name || v.id);
    v.type = VERT_TYPES.includes(String(v.type)) ? String(v.type) : "stairs";
    v.x = num(v.x); v.y = num(v.y);
    v.confidence = Number.isFinite(+v.confidence) ? +v.confidence : 1;
    const floors = [];
    for (const lv of v.floors || []) {
      const n = parseInt(lv, 10);
      if (Number.isInteger(n) && !floors.includes(n)) floors.push(n);
    }
    v.floors = floors.sort((a, b) => a - b);
    const pos = {};
    for (const [k, p] of Object.entries(v.positions || {})) {
      const pt = asPoint(p);
      const lv = parseInt(k, 10);
      if (pt && Number.isInteger(lv)) pos[String(lv)] = pt;
    }
    v.positions = pos;
    return v;
  });
}

function bakeAlignment(data) {
  let did = false;
  for (const fl of data.floors) {
    const al = fl.alignment;
    if (al.offset_x || al.offset_y || al.rotation_deg) {
      did = true;
      const xf = (x, y) => transform(x, y, al);
      fl.outline = fl.outline.map((p) => xf(p[0], p[1]));
      for (const w of fl.walls) {
        const a = xf(w.x1, w.y1), b = xf(w.x2, w.y2);
        w.x1 = a[0]; w.y1 = a[1]; w.x2 = b[0]; w.y2 = b[1];
      }
      for (const s of fl.spaces) s.polygon = s.polygon.map((p) => xf(p[0], p[1]));
      for (const d of fl.doors) {
        const p = xf(d.x, d.y);
        d.x = p[0]; d.y = p[1];
        if (d.axis) d.axis = rotateAxis(d.axis[0], d.axis[1], al.rotation_deg);
      }
      for (const v of data.vertical_connections) {
        const key = String(fl.level);
        if (v.positions[key]) v.positions[key] = xf(v.positions[key][0], v.positions[key][1]);
      }
    }
    fl.alignment = { offset_x: 0, offset_y: 0, rotation_deg: 0 };
  }
  return did;
}

function loadRaw(raw, opts = {}) {
  const data = structuredClone(raw);
  const fromServer = opts.fromServer === true || (opts.fromServer !== false && data.grid != null);
  delete data.grid; delete data.exits; delete data.warnings; delete data.levels;
  sanitize(data);
  const baked = fromServer ? false : bakeAlignment(data);
  if (fromServer) for (const fl of data.floors) fl.alignment = { offset_x: 0, offset_y: 0, rotation_deg: 0 };
  doc = data;
  floorLevel = doc.floors[0].level;
  history = []; future = []; pendingBefore = null;
  sel = null; draft = null; hover = null;
  serverIssues = [];
  saveState = "saved";
  const slug = slugName(doc.building);
  if ($("saveName") && (!$("saveName").value || opts.setName)) $("saveName").value = slug;
  if (opts.setName) $("saveName").value = slug;
  buildInspector();
  updateChrome();
  fit();
  if (baked && !opts.silent) toast("Applied each floor's alignment into the shared frame.");
  return baked;
}

function allIds() {
  const s = new Set();
  for (const fl of doc.floors) {
    for (const w of fl.walls) s.add(w.id);
    for (const sp of fl.spaces) s.add(sp.id);
    for (const d of fl.doors) s.add(d.id);
  }
  for (const v of doc.vertical_connections) s.add(v.id);
  for (const m of doc.multi_floor_spaces || []) if (m && m.id) s.add(String(m.id));
  return s;
}
function allocId(prefix, reserved) {
  const used = allIds();
  let n = 1, id = prefix + n;
  while (used.has(id) || (reserved && reserved.has(id))) { n += 1; id = prefix + n; }
  if (reserved) reserved.add(id);
  return id;
}
function slugName(s) {
  const t = String(s || "building").toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 64);
  return t || "building";

    const fl = structuredClone(src);
    fl.level = level;
    fl.alignment = { offset_x: 0, offset_y: 0, rotation_deg: 0 };
    const reserved = allIds();
    const take = (base) => {
      let n = 1, id = base + n;
      while (reserved.has(id)) { n += 1; id = base + n; }
      reserved.add(id);
      return id;

    const map = new Map();
    for (const s of fl.spaces) {
      let id = `F${level}-` + String(s.id).replace(/^F\d+-/, "");
      if (!id || id === `F${level}-` || reserved.has(id)) id = take(`F${level}-S`);
      else reserved.add(id);
      map.set(s.id, id);
      s.id = id;
    }
    for (const w of fl.walls) w.id = take(`F${level}-W`);
    for (const d of fl.doors) {

      d.connects = (d.connects || []).map((c) => map.get(c) || c);

function parseJsonText(text) {

}
async function pushToViewer() {

function goSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) return;
  if (searchQ !== q) {
    searchQ = q; searchHits = []; searchAt = 0;
    const add = (level, kind, id, label) => {
      const blob = (id + " " + (label || "")).toLowerCase();
      if (blob.includes(q)) searchHits.push({ level, kind, id });
    };
    for (const fl of doc.floors) {
      for (const s of fl.spaces) add(fl.level, "space", s.id, s.label);
      for (const d of fl.doors) {
        if (q === "exit" && d.exterior_exit) searchHits.push({ level: fl.level, kind: "door", id: d.id });
        else add(fl.level, "door", d.id, "");
      }
      for (const w of fl.walls) add(fl.level, "wall", w.id, "");
    }
    for (const v of doc.vertical_connections) {
      if ((v.id + " " + v.name).toLowerCase().includes(q)) {
        const lv = v.floors.find((n) => doc.floors.some((f) => f.level === n));
        searchHits.push({ level: lv == null ? floorLevel : lv, kind: "vertical", id: v.id });
      }
    }
  } else if (searchHits.length) searchAt = (searchAt + 1) % searchHits.length;
  const hit = searchHits[searchAt];
  if (!hit) { toast("Nothing matches."); return; }
  if (doc.floors.some((f) => f.level === hit.level)) floorLevel = hit.level;
  setSelection({ kind: hit.kind, id: hit.id, part: "body" });
  const fl = current();
  let p = [0, 0];
  if (hit.kind === "space") { const s = byId(fl.spaces, hit.id); if (s) p = centroid(s.polygon); }
  else if (hit.kind === "door") { const d = byId(fl.doors, hit.id); if (d) p = [d.x, d.y]; }
  else if (hit.kind === "wall") { const w = byId(fl.walls, hit.id); if (w) p = [(w.x1 + w.x2) / 2, (w.y1 + w.y2) / 2]; }
  else if (hit.kind === "vertical") { const v = byId(doc.vertical_connections, hit.id); if (v) p = vertPoint(v, fl.level); }
  centerOn(p[0], p[1]);
  toast(`${searchAt + 1} of ${searchHits.length}: ${hit.id}`);
}

      if (d) applyMeasuredScale(d.width, knownLength(), d.x, d.y, d.x + (d.axis ? d.axis[0] : 1) * d.width, d.y + (d.axis ? d.axis[1] : 0) * d.width);

      walls: [{ id: "W", x1: 0, y1: 0, x2: 1, y2: 0, exterior: false, confidence: 1 }],
      spaces: [],
      doors: [{ id: "D", x: 1, y: 0, width: 0.9, connects: ["OUTSIDE"], exterior_exit: true, axis: [1, 0], confidence: 1 }],
    }],
    vertical_connections: [{ id: "V", name: "S", type: "stairs", x: 3, y: 4, floors: [1, 2], positions: { "1": [0, 0] }, confidence: 1 }],
  }, { silent: true, fromServer: false });
  const w = current().walls[0];
  assert(Math.abs(w.x2 - 10) < 1e-9 && Math.abs(w.y2 - 1) < 1e-9, "wall baked");
  assert(Math.abs(w.x1 - 10) < 1e-9 && Math.abs(w.y1) < 1e-9, "wall start baked");
  const d = current().doors[0];
  assert(Math.abs(d.x - 10) < 1e-9 && Math.abs(d.y - 1) < 1e-9, "door baked");
  assert(Math.abs(d.axis[0]) < 1e-9 && Math.abs(d.axis[1] - 1) < 1e-9, "axis baked");
  const v = doc.vertical_connections[0];
  assert(v.x === 3 && v.y === 4, "vertical xy stays shared");
  assert(Math.abs(v.positions["1"][0] - 10) < 1e-9 && Math.abs(v.positions["1"][1]) < 1e-9, "position baked");
  assert(current().alignment.rotation_deg === 0 && current().alignment.offset_x === 0, "alignment zeroed");
  const dumped = exportDoc();
  assert(!dumped.grid && dumped.floors[0].alignment.offset_x === 0, "export frame");
  assert(dumped.floors[0].doors[0].axis, "export keeps axis");
  const x2 = dumped.floors[0].walls[0].x2;
  loadRaw(dumped, { silent: true, fromServer: false });
  assert(Math.abs(current().walls[0].x2 - x2) < 1e-6, "reload is stable");

  loadRaw({
    building: "Server", grid: { cell: 0.5 },
    floors: [{
      level: 1, alignment: { offset_x: 5, offset_y: 0, rotation_deg: 90 },
      outline: [[0, 0], [10, 0], [10, 10]],
      walls: [{ id: "W", x1: 0, y1: 1, x2: 4, y2: 1, exterior: true, confidence: 1 }],
      spaces: [], doors: [{ id: "D", x: 1, y: 1, width: 0.9, connects: [], exterior_exit: false, axis: null, confidence: 1 }],
    }],
    vertical_connections: [],
  }, { silent: true, fromServer: true });
  assert(current().walls[0].x1 === 0 && current().walls[0].y1 === 1, "server coords stay put");
  assert(current().alignment.rotation_deg === 0, "server alignment cleared");

  const fixture = () => ({
    building: "Scale",
    floors: [
      { level: 1, alignment: { offset_x: 0, offset_y: 0, rotation_deg: 0 }, outline: [[0, 0], [10, 0], [10, 4], [0, 4]],
        walls: [{ id: "W", x1: 0, y1: 0, x2: 2, y2: 0, exterior: true, confidence: 1 }], spaces: [],
        doors: [{ id: "D", x: 1, y: 0, width: 2, connects: ["OUTSIDE"], exterior_exit: true, confidence: 1 }] },
      { level: 2, alignment: { offset_x: 0, offset_y: 0, rotation_deg: 0 }, outline: [[0, 0], [10, 0], [10, 4]],
        walls: [], spaces: [], doors: [] },
    ],
    vertical_connections: [{ id: "V", name: "Stair", type: "stairs", x: 1, y: 1, floors: [1, 2], confidence: 1 }],
  });
  loadRaw(fixture(), { silent: true });
  $("scaleScope").value = "all";
  applyMeasuredScale(2, 1, 0, 0, 2, 0);
  assert(Math.abs(current().walls[0].x1 - 0.5) < 1e-9 && Math.abs(current().walls[0].x2 - 1.5) < 1e-9, "scale wall");
  assert(Math.abs(current().doors[0].width - 1) < 1e-9, "scale width");
  assert(Math.abs(doc.vertical_connections[0].y - 0.5) < 1e-9, "scale vertical");
  assert(Math.abs(doc.floors[1].outline[1][0] - 5.5) < 1e-9, "scale other floor");
  undo();
  assert(Math.abs(current().walls[0].x2 - 2) < 1e-9, "undo scale");
  redo();
  assert(Math.abs(current().walls[0].x2 - 1.5) < 1e-9, "redo scale");

  loadRaw(fixture(), { silent: true });
  $("scaleScope").value = "floor";
  applyMeasuredScale(2, 1, 0, 0, 2, 0);
  assert(Math.abs(doc.floors[1].outline[1][0] - 10) < 1e-9, "other floor stays");
  assert(Math.abs(doc.vertical_connections[0].x - 1) < 1e-9 && Math.abs(doc.vertical_connections[0].y - 1) < 1e-9, "shared point stays");
  const p1 = vertPoint(doc.vertical_connections[0], 1);
  assert(Math.abs(p1[1] - 0.5) < 1e-9, "this floor stair moved");

  const room = [[0, 0], [10, 0], [10, 10], [0, 10]];
  const hall = [[0, 10], [10, 10], [10, 14], [0, 14]];
  loadRaw({
    building: "Links",
    floors: [{
      level: 1, alignment: { offset_x: 0, offset_y: 0, rotation_deg: 0 }, outline: [[0, 0], [10, 0], [10, 14], [0, 14]],
      walls: [{ id: "W", x1: 0, y1: 10, x2: 10, y2: 10, exterior: false, confidence: 1 }],
      spaces: [
        { id: "R", label: "R", type: "classroom", polygon: room, multi_floor: false, confidence: 1 },
        { id: "H", label: "Hall", type: "hallway", polygon: hall, multi_floor: false, confidence: 1 },
      ],
      doors: [],
    }],
    vertical_connections: [],
  }, { silent: true });
  const links = inferConnects(current(), 5, 10, [1, 0]);
  assert(links.includes("R") && links.includes("H"), "infer connects " + links.join(","));
  let added = 0;
  edit(() => { added = addWallsAlong([[2, 2], [6, 2], [6, 5], [2, 5]], false, [{ x: 4, y: 2, width: 1 }]); });
  assert(added === 5, "walls along room with a door gap, got " + added);
  loadRaw({
    building: "Cut",
    floors: [{
      level: 1, alignment: { offset_x: 0, offset_y: 0, rotation_deg: 0 }, outline: [],
      walls: [{ id: "W", x1: 0, y1: 0, x2: 10, y2: 0, exterior: false, confidence: 1 }],
      spaces: [], doors: [{ id: "D", x: 5, y: 0, width: 2, connects: [], exterior_exit: false, confidence: 1 }],
    }],
    vertical_connections: [],
  }, { silent: true });
  const cuts = cutWallsAtDoors(current());
  assert(cuts === 1 && current().walls.length === 2, "cut count");
  const ends = current().walls.map((ww) => [ww.x1, ww.x2].sort((a, b) => a - b));
  assert(ends.some((e) => Math.abs(e[1] - 4) < 1e-6) && ends.some((e) => Math.abs(e[0] - 6) < 1e-6), "cut ends");

  loadRaw({
    building: "Dup",
    floors: [{
      level: 1, alignment: { offset_x: 0, offset_y: 0, rotation_deg: 0 }, outline: [[0, 0], [4, 0], [4, 4]],
      walls: [], spaces: [{ id: "F1-A", label: "A", type: "office", polygon: [[0, 0], [2, 0], [2, 2]], multi_floor: false, confidence: 1 }],
      doors: [{ id: "F1-D1", x: 1, y: 2, width: 0.9, connects: ["F1-A", "OUTSIDE"], exterior_exit: true, confidence: 1 }],
    }],
    vertical_connections: [],
  }, { silent: true });
  duplicateFloor();
  const fl2 = doc.floors.find((f) => f.level === 2);
  assert(fl2 && fl2.spaces[0].id !== "F1-A", "new space id");
  assert(fl2.doors[0].connects.includes(fl2.spaces[0].id) && fl2.doors[0].connects.includes("OUTSIDE"), "connects remapped");

  loadRaw(fixture(), { silent: true });
  $("snap").value = "0";
  $("optCorners").checked = false;
  const before = current().walls.length;
  setTool("wall");
  clickWorld(12, 3);
  clickWorld(15, 3);
  assert(current().walls.length === before + 1, "pointer adds a wall");
  const last = current().walls[current().walls.length - 1];
  assert(Math.abs(last.x1 - 12) < 1e-6 && Math.abs(last.x2 - 15) < 1e-6 && Math.abs(last.y1 - 3) < 1e-6, "pointer coordinates");
  $("selftest").textContent = "PASS";
}
function clickWorld(x, y) {
  const rect = canvas.getBoundingClientRect();
  const [sx, sy] = worldToScreen(x, y);
  const base = { bubbles: true, cancelable: true, clientX: rect.left + sx, clientY: rect.top + sy, pointerId: 1, pointerType: "mouse", button: 0 };
  canvas.dispatchEvent(new PointerEvent("pointerdown", { ...base, buttons: 1 }));
  canvas.dispatchEvent(new PointerEvent("pointerup", { ...base, buttons: 0 }));
}

bind();
resize();
if (location.hash === "#selftest") {
  try { runSelfTest(); }
  catch (err) { $("selftest").textContent = "FAIL " + (err && err.stack ? err.stack : err); }
  finally { saveState = "saved"; }
} else {
  (async () => {
    try {
      const r = await fetch("/api/building");
      if (!r.ok) throw new Error(await r.text());
      loadRaw(await r.json(), { fromServer: true, setName: true });
      serverOn = true; $("serverDot").classList.add("on");
    } catch {
      serverOn = false;
      loadRaw(blankBuilding(), { setName: true, silent: true });
      toast("No server yet. Open a JSON file, or start uvicorn and reload.");
    }
  })();
}
</script>
</body>
</html>
